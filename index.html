<script>
/* Motor de ilustração: silhuetas a tinta da china sobre sépia, com profundidade, névoa, vinheta e grão.
   Funciona no navegador e em Node (@napi-rs/canvas). */
(function (raiz) {
const W = 1200, H = 680, TINTA = '#0d0803', NE = '#22170b', LONGE = '#4a3517';
let MK = null;

function rng(seed) { let a = seed >>> 0; return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function camada() { const c = MK(W, H); return { c, x: c.getContext('2d') }; }
function ruido(r, w, h, cel, alfa) {
  const gw = Math.max(2, Math.ceil(w / cel)), gh = Math.max(2, Math.ceil(h / cel));

}
function desfoca(c, f) {

  const o = MK(W, H), ox = o.getContext('2d'); ox.imageSmoothingQuality = 'high'; ox.drawImage(s, 0, 0, W, H); return o;
}
function aguada(L, r, forca, cel) {
  L.x.save(); L.x.globalCompositeOperation = 'destination-out';
  L.x.globalAlpha = forca; L.x.drawImage(ruido(r, W, H, cel || 46, 1), 0, 0);
  L.x.globalAlpha = forca * .6; L.x.drawImage(ruido(r, W, H, 11, 1), 0, 0); L.x.restore();
}

function fundo(x, r, o) {

  rg.addColorStop(0, `rgba(255,247,218,${.97 * o.luz})`); rg.addColorStop(.22, `rgba(248,228,175,${.75 * o.luz})`); rg.addColorStop(.6, `rgba(225,190,120,${.3 * o.luz})`); rg.addColorStop(1, 'rgba(220,180,110,0)');
  x.fillStyle = rg; x.fillRect(0, 0, W, H);

/* O Farol do Corvo: história original.
   Cada secção: t (texto), cena (ilustração), lugar (mapa), ch (escolhas), e opcionalmente

/* ===================== CAPÍTULO I · VILA NEGRA ===================== */
start: { cap: 'I · Vila Negra', cena: 'cais', lugar: 'cais', t:
`O barco do correio larga-te no cais de Vila Negra quando o sol já se afoga no mar. Ninguém te espera. As redes estão estendidas mas não há pescadores, e as janelas da aldeia estão todas fechadas, apesar de ainda não ser noite.

Lá em cima, na ponta da ilha, o Farol do Corvo está apagado há três noites. Nesse tempo, quatro barcos partiram-se nos Dentes, os rochedos que fecham a baía. A Câmara de Porto Alto pagou-te para descobrir o que aconteceu ao faroleiro, Mestre Anselmo, e voltar a acender a luz.

O barqueiro já está a desatar o cabo, com pressa de se ir embora.

— Esta noite é maré viva — diz, sem olhar para ti. — A frota do bacalhau entra de madrugada. Se o farol não acender até a maré encher, não sobra um barco.`,
 ch: [c('Perguntar ao barqueiro porque tem tanta pressa', 'barqueiro'), c('Subir à praça da aldeia', 'praca')] },

barqueiro: { cena: 'cais', lugar: 'cais', fx: { flag: 'aviso' }, t:
`O barqueiro pára de mexer no cabo. Olha para a falésia, depois para ti, e baixa a voz.

— Há três noites que se vêem luzes verdes no alto do farol. E há três noites que os afogados não ficam no fundo do mar. A minha irmã viu um a bater-lhe à porta, com a cara do marido.

Cospe para a água.

— Ouve o que te digo, que é de graça. Se ouvires o teu nome no nevoeiro, não respondas. Seja a voz de quem for.

Empurra o barco com o remo e afasta-se sem dizer adeus. Ficas sozinho no cais, a ouvir as ondas.`,
 ch: [c('Subir à praça', 'praca')] },

praca: { cena: 'cais', lugar: 'praca', t:
`A praça de Vila Negra é um largo de terra batida à volta de um cruzeiro de pedra. Reparas numa coisa estranha: em todas as soleiras há uma linha de sal grosso, branca, como se os moradores quisessem impedir alguma coisa de entrar.

Da taberna sai fumo e um murmúrio de vozes. A capela, num rochedo mais acima, tem as velas acesas. A casa do faroleiro fica no começo do caminho da falésia, de porta escancarada. Para lá do muro baixo, entre as cruzes tortas, fica o cemitério.`,
 ch: [c('Entrar na Taberna do Bacalhau Seco', 'taberna'), c('Subir à capela', 'capela'), c('Ir à casa do faroleiro', 'casa'), c('Entrar no cemitério', 'cemiterio', { notFlag: 'cemiterio' }), c('Seguir pelo caminho da falésia', 'falesia1')] },

taberna: { cena: 'taberna', lugar: 'taberna', fx: { mare: 1 }, t:
`A Taberna do Bacalhau Seco é baixa e escura e cheira a vinho azedo. Três pescadores bebem calados à mesa do meio. Quando entras, param de falar e ficam a olhar para a porta atrás de ti, até a fechares.

Atrás do balcão, uma mulher de braços cruzados mede-te de cima a baixo: é Dona Rosário. Ao canto, junto à lareira, um velho de chapéu de oleado fuma um cachimbo e sorri como se te estivesse à espera há muito tempo.`,
 ch: [c('Falar com Dona Rosário', 'rosario', { notFlag: 'rosario' }), c('Sentar-te com o velho da lareira', 'velho', { notFlag: 'velho' }), c('Tirar um archote do monte de lenha junto à lareira', 'archote', { notFlag: 'archote' }), c('Comprar mantimentos', 'loja'), c('Sair para a praça', 'praca')] },

rosario: { cena: 'taberna', lugar: 'taberna', fx: { flag: 'rosario', item: 'Óleo de Baleia' }, t:
`— Vens por causa do farol — diz ela, antes de abrires a boca. — Há quatro noites apareceu aqui um homem que eu nunca tinha visto. Alto, de capa verde-escura a brilhar como pele de enguia. Pagou com moedas cobertas de sal e disse que se chamava Dom Vidal. Na noite seguinte, o farol apagou-se.

Tira de debaixo do balcão uma bilha de barro selada com cera.

— Óleo de baleia. O Anselmo veio cá buscá-lo e já não voltou para o levar. Sem isto, aquela lâmpada não acende nem com reza.

Depois, mais baixo:

— O Anselmo nunca entrava na gruta sem a lanterna de furacão dele. Dizia que lá em baixo um homem sem luz é um homem morto.`,
 ch: [c('Guardar o óleo e voltar ao balcão', 'taberna')] },

velho: { cena: 'taberna', lugar: 'taberna', fx: { flag: 'velho', mare: 1 }, t:
`O velho chama-se Tomé e foi faroleiro antes do Anselmo. Quando dizes o nome Vidal, deixa de sorrir.

— Bruxo das marés. Já cá esteve no tempo do meu avô. Afoga os barcos e guarda as almas dos homens em frascos, lá em baixo, num ossário por baixo do farol. Cada alma dá-lhe mais um ano de vida.

Bate com o cachimbo na mesa.

— Duas coisas o fazem tremer. O Sino de Santa Bárbara, que caiu da igreja velha para o mar e está na Gruta Afogada. E o nome verdadeiro dele, que ninguém sabe. Dizem que está escrito numa pedra, mas ninguém se lembra de qual.

Depois volta a sorrir e tira dois dados de osso da algibeira.

— E agora jogas uma partida com um velho? Três moedas.`,
 ch: [c('Aceitar a partida de ossos (3 moedas)', 'jogo', { ouro: 3 }), c('Recusar e voltar ao balcão', 'taberna')] },

jogo: { cena: 'taberna', lugar: 'taberna', t: `Tomé sopra os dados para lhes dar sorte. Cada um lança os seus. Quem tirar mais, fica com as moedas.`,

jogo_ganha: { cena: 'taberna', lugar: 'taberna', som: 'sorte', fx: { item: 'Dente de Tubarão' }, t:
`Tomé ri-se até tossir. Em vez de moedas, tira do pescoço um dente de tubarão preso num fio de couro.

jogo_perde: { cena: 'taberna', lugar: 'taberna', fx: { ouro: -3 }, t:
`— Os ossos gostam de mim — diz Tomé, enfiando as tuas moedas na algibeira. — Não leves a mal. Toma lá um conselho de borla: na gruta, segue o corvo. O Anselmo marcava tudo com um corvo.`,

archote: { cena: 'taberna', lugar: 'taberna', fx: { flag: 'archote', archote: 6 }, t:
`Escolhes um pau de pinho com a ponta embebida em resina e acendes-lo nas brasas. Dona Rosário vê-te, mas não diz nada.

Um dos pescadores fala pela primeira vez, sem levantar os olhos do copo:

— Isso não dura muito. Lá em baixo, quando se apaga, apaga-se de vez.

Um archote ilumina pouco tempo. Na Folha de Aventuras vês quanto resta.`,

loja: { cena: 'taberna', lugar: 'taberna', t: `Dona Rosário abre a despensa e mostra o que tem. Não faz descontos, mas também não engana ninguém.`,

  { nome: 'Provisões', preco: 2, prov: 1, d: 'Pão, queijo e chouriço. Repõem 4 de Energia.' },

capela: { cena: 'capela', lugar: 'capela', fx: { mare: 1 }, t:
`A Capela de São Pedro dos Náufragos é pequena e fria. A luz da lua entra pela janela alta e cai sobre o altar. Das traves pendem dezenas de barquinhos de madeira, oferecidos por quem voltou do mar. Nas paredes há retratos de quem não voltou.

Uma mulher vestida de negro reza ajoelhada diante do altar. Não se vira quando entras, mas pára de rezar.`,
 ch: [c('Ajoelhar-te e rezar', 'rezar', { notFlag: 'rezou' }), c('Falar com a mulher de negro', 'beata', { notFlag: 'beata' }), c('Ler os papéis presos aos ex-votos', 'exvotos', { notFlag: 'exvotos' }), c('Voltar à praça', 'praca')] },

rezar: { cena: 'capela', lugar: 'capela', som: 'sorte', fx: { flag: 'rezou', sorte: 2 }, t:
`Ajoelhas-te na pedra fria e fechas os olhos. Não sabes bem a quem pedes, mas pedes. Quando te levantas, a chama da vela mais próxima endireita-se, como se alguém tivesse fechado uma janela que não existe.

beata: { cena: 'capela', lugar: 'capela', fx: { flag: 'beata', item: 'Amuleto de Búzio' }, t:
`A mulher chama-se Benedita. O filho dela, Joaquim, ia no segundo barco que se perdeu nos Dentes. Não encontraram o corpo.

— Eu ouço-o — diz ela. — À noite, debaixo do chão, a chamar por mim. Não está morto como os outros mortos. Está preso.

Tira do bolso um búzio pequeno, furado, preso num cordão.

— O Joaquim usava isto contra o canto das moiras. Nessa manhã esqueceu-se dele. Leva-o tu. E se o encontrares lá em baixo, diz-lhe que a mãe não está zangada.`,
 ch: [c('Prometer-lhe que vais tentar', 'capela')] },

exvotos: { cena: 'capela', lugar: 'capela', fx: { flag: 'exvotos' }, fx2: { flag: 'nota' }, t:
`Percorres a parede com uma vela na mão. Entre os ex-votos antigos há um papel dobrado, preso com um alfinete, de tinta ainda fresca. Desdobra-lo.

«Se me acontecer alguma coisa, a chave do farol está onde o corvo dorme. Não confiem em luzes verdes. A.»`,

casa: { cena: 'casa', lugar: 'casa', fx: { mare: 1 }, t:
`A porta da casa do faroleiro bate ao vento. Lá dentro, cadeiras viradas e gavetas despejadas no chão. Alguém procurou alguma coisa com pressa, e não encontrou, porque voltou várias vezes: há pegadas molhadas por todo o lado, umas por cima das outras.

Em frente à janela, um corvo empalhado vigia a sala de cima de um poleiro. Ao fundo há uma porta para o quarto e outra, mais pequena, para a despensa. Da despensa vem um barulho de unhas a arranhar madeira.`,
 ch: [c('Examinar o corvo empalhado', 'corvo', { notFlag: 'corvo' }), c('Entrar no quarto', 'quarto', { notFlag: 'quarto' }), c('Abrir a despensa', 'despensa', { notFlag: 'despensa' }), c('Sair para o caminho da falésia', 'falesia1'), c('Voltar à praça', 'praca')] },

corvo: { cena: 'casa', lugar: 'casa', fx: { flag: 'corvo' }, t:
`O corvo cheira a pó e a cânfora. Os olhos de vidro parecem seguir-te. O poleiro é um tronco grosso, pregado à parede por baixo da janela.`,
 ch: [c('Procurar por baixo do poleiro, como dizia o papel da capela', 'corvo_chave', { flag: 'nota' }), c('Revistar o corvo ao acaso', 'corvo_procura', { notFlag: 'nota' })] },

corvo_procura: { cena: 'casa', lugar: 'casa', t: `Viras o pássaro de todos os lados, apalpas as penas, abanas o poleiro. Encontrar alguma coisa aqui vai depender da tua sorte.`,

corvo_chave: { cena: 'casa', lugar: 'casa', som: 'chave', fx: { item: 'Chave do Farol' }, t:
`Na parte de baixo do poleiro, a madeira tem uma cavidade tapada com cera. Lá dentro está uma chave de ferro, comprida como a tua mão, com um corvo gravado no anel.`,

corvo_nada: { cena: 'casa', lugar: 'casa', t:
`Uma asa parte-se-te na mão e cai uma chuva de penas e serradura. Não encontras nada. O corvo, agora torto, parece olhar-te com desprezo.`,

quarto: { cena: 'afogado', lugar: 'casa', som: 'gemido', fx: { mare: 1 }, t:
`O quarto está às escuras e cheira a maré baixa. Há alguém sentado na cama, de costas para ti, a pingar água para o soalho.

— Anselmo? — chamas.

O vulto vira a cabeça devagar, demasiado devagar, e depois o resto do corpo. Não é o Anselmo. É um homem inchado e branco, com algas no cabelo e os olhos leitosos como peixe cozido. Um AFOGADO.

Abre a boca e sai-lhe água do mar. Levanta-se e vem para ti de braços estendidos.`,

quarto_sal: { cena: 'afogado', lugar: 'casa', som: 'gemido', fx: { drop: 'Saco de Sal' }, t:
`Atiras-lhe o sal à cara. O afogado guincha como uma chaleira, tapa os olhos com as mãos e desfaz-se em água ali mesmo, aos teus pés. Usaste o sal todo.`,

quarto_ganho: { cena: 'afogado', lugar: 'casa', fx: { flag: 'quarto', ouro: 4 }, fx2: { flag: 'marcas' }, t:
`Do afogado sobra uma poça que escorre pelas frestas do soalho.

«Gravei a marca do corvo nas rochas da Gruta Afogada para nunca me perder. Quem tiver luz que siga o bico do corvo. Onde o corvo tiver uma cruz por cima, é o ossário dele. Lá não se entra.»

«Ele quer a luz apagada até à maré grande. Teme o bronze. Teme o sino.»

Entre as folhas há quatro moedas, que guardas.`,

despensa: { cena: 'casa', lugar: 'casa', som: 'garras', fx: { flag: 'despensa' }, t:
`Abres a porta da despensa e o barulho pára. Depois recomeça, mais perto. Vêm do escuro dezenas de olhos pequenos e vermelhos, e um cheiro a peixe podre: RATAZANAS DO MAR, do tamanho de gatos, com as caudas peladas e escamosas.

despensa_ganha: { cena: 'casa', lugar: 'casa', som: 'chave', fx: { item: 'Lanterna de Furacão' }, t:

cemiterio: { cena: 'cemiterio', lugar: 'cemiterio', fx: { flag: 'cemiterio', mare: 1 }, t:
`O cemitério é um pedaço de encosta onde as cruzes se inclinam todas para o mar, como se o vento as tivesse penteado. A lua está enorme por cima da árvore morta do centro, e a árvore está cheia de corvos. Nenhum grasna.

Reparas nas campas recentes. Estão abertas. A terra não foi cavada de fora para dentro: foi empurrada de dentro para fora.

cemiterio_sal: { cena: 'cemiterio', lugar: 'cemiterio', fx: { drop: 'Saco de Sal' }, t:
`Desenhas um círculo de sal à tua volta. Os afogados param na linha branca, gemem, e não a atravessam. Ficam ali a olhar-te, a pingar, até que um a um se deitam de novo nas covas.

cemiterio_luta: { cena: 'cemiterio', lugar: 'cemiterio', som: 'gemido', t:

lapide: { cena: 'cemiterio', lugar: 'cemiterio', fx: { flag: 'nome' }, t:

AFOGADO EM 1789
QUE O MAR O GUARDE

Por baixo, alguém riscou com uma faca: «não guardou».

Agora sabes o nome verdadeiro do bruxo das marés.`,
 ch: [c('Voltar à praça', 'praca'), c('Seguir pelo caminho da falésia', 'falesia1')] },

/* ===================== CAPÍTULO II · A FALÉSIA ===================== */
falesia1: { cap: 'II · A Falésia', cena: 'falesia', lugar: 'falesia', fxA: { mare: 1 }, t:
`O caminho da falésia é estreito e sobe aos ziguezagues entre urzes e pedras soltas. O vento empurra-te para o precipício como uma mão aberta. Lá em baixo, o mar ferve contra as rochas.

A meio da subida, o caminho divide-se. Um carreiro de cabras desce para uma pequena praia, onde a boca negra de uma gruta engole e cospe as ondas. Outro, mais curto, corta direito pela charneca, onde o nevoeiro já se deitou.`,
 ch: [c('Continuar pelo caminho até ao farol', 'falesia2'), c('Atalhar pela charneca, através do nevoeiro', 'charneca'), c('Descer pelo carreiro até à praia', 'praia'), c('Voltar à aldeia', 'praca')] },

charneca: { cena: 'avejao', lugar: 'charneca', t:
`O nevoeiro fecha-se atrás de ti. Ao fim de poucos passos já não vês o mar nem a aldeia. Só ouves o vento nas urzes e o teu próprio coração.

Depois, muito perto, alguém diz o teu nome.

É uma voz que conheces. Não sabes de onde, mas conheces. Uma voz de alguém de quem gostas e que não vês há muito tempo. Volta a chamar, mais baixo, quase a chorar.`,
 ch: [c('Responder à voz', 'avejao_resp'), c('Lembrar o aviso do barqueiro e seguir calado', 'charneca_aviso', { flag: 'aviso' }), c('Tapar os ouvidos e seguir calado', 'charneca_teste', { notFlag: 'aviso' }), c('Voltar para trás a correr', 'falesia1')] },

charneca_aviso: { cena: 'avejao', lugar: 'charneca', t:
`Mordes a língua e continuas a andar, de olhos no chão. A voz chama mais três vezes, cada vez mais zangada, e depois cala-se.

Quando o nevoeiro se abre, estás no alto da falésia, mesmo ao pé do farol. O atalho poupou-te tempo.`,
 ch: [c('Ir até à porta do farol', 'portafarol')] },

charneca_teste: { cena: 'avejao', lugar: 'charneca', t: `Tapas os ouvidos com as mãos e andas. A voz não se cala. Chama-te pelo nome, e pelo nome que te davam em criança.`,
 teste: { tipo: 'sorte', ok: 'charneca_aviso', ko: 'avejao_resp' } },

avejao_resp: { cena: 'avejao', lugar: 'charneca', som: 'rugido', t:
`— Sim? — respondes, sem querer.

O nevoeiro à tua frente endurece. Ergue-se até ao dobro da tua altura, ganha ombros e braços compridos que lhe chegam aos joelhos, e duas brasas pálidas no sítio dos olhos. É um AVEJÃO, a coisa que vive no nevoeiro e se alimenta de quem lhe responde.`,
 luta: { foes: [{ nome: 'Avejão', hab: 9, en: 8 }], win: 'avejao_ganho', fuga: 'falesia1', fugaApos: 2 } },

avejao_ganho: { cena: 'avejao', lugar: 'charneca', fx: { en: -1 }, t:
`A tua espada atravessa-o pela última vez e o avejão desfaz-se em fumo frio, que te entra pela boca e pelo nariz e te deixa a tremer.

O nevoeiro levanta. Estás no alto da falésia, ao pé do farol.`,
 ch: [c('Ir até à porta do farol', 'portafarol')] },

falesia2: { cena: 'ninhos', lugar: 'ninhos', som: 'gaivota', t:
`Perto do topo, o chão fica branco de excrementos e o ar cheira a peixe podre. Ouves um bater de asas pesado, como lençóis molhados ao vento. Das rochas levantam-se três GAIVOTÕES, aves do tamanho de um homem, com bicos curvos como facas de esfolar.

Há ninhos por toda a parte, e tu estás no meio deles.`,
 ch: [c('Desembainhar a espada e abrir caminho', 'gaivotas_luta'), c('Encostar-te à rocha e passar devagar', 'gaivotas_teste')] },

gaivotas_teste: { cena: 'ninhos', lugar: 'ninhos', t: `Encostas as costas à rocha e avanças de lado, passo a passo, sem tirar os olhos das aves. Uma pedra solta debaixo do pé pode estragar tudo.`,
 teste: { tipo: 'hab', ok: 'gaivotas_ok', ko: 'gaivotas_luta' } },

gaivotas_ok: { cena: 'ninhos', lugar: 'ninhos', t: `Os gaivotões seguem-te com os olhos amarelos, mas nenhum se mexe. Passas o último ninho e chegas ao alto da falésia sem uma beliscadura.`,
 ch: [c('Seguir até à porta do farol', 'portafarol')] },

gaivotas_luta: { cena: 'ninhos', lugar: 'ninhos', som: 'gaivota', t: `Os gaivotões caem sobre ti aos gritos, um de cada vez, a picar e a bater as asas.`,
 luta: { foes: [{ nome: 'Primeiro Gaivotão', hab: 5, en: 4 }, { nome: 'Segundo Gaivotão', hab: 6, en: 4 }, { nome: 'Terceiro Gaivotão', hab: 5, en: 5 }], win: 'portafarol' } },

portafarol: { cena: 'farol', lugar: 'farol', t:
`O Farol do Corvo ergue-se à tua frente, branco e altíssimo, contra as nuvens que correm. Lá em cima, por trás dos vidros, vês uma luz esverdeada, fraca, a mexer-se devagar, como se alguém andasse lá dentro a passear com ela.

A porta é de carvalho reforçado a ferro, e está fechada.`,
 ch: [c('Abrir a porta com a chave do corvo', 'base', { req: 'Chave do Farol' }), c('Atirar-te à porta com o ombro', 'porta_ombro'), c('Subir pela parede de fora com a corda', 'escalar', { req: 'Corda de Cânhamo' }), c('Descer até à praia da gruta', 'praia')] },

porta_ombro: { cena: 'farol', lugar: 'farol', som: 'porta', fxA: { en: -2 }, t: `Atiras-te contra a porta com toda a força. É como dar com o ombro numa falésia. Lá em cima, a luz verde pára de se mexer, como quem escuta. Perdes 2 pontos de Energia.`,
 ch: [c('Pensar noutra solução', 'portafarol')] },

escalar: { cena: 'farol', lugar: 'farol', t: `Lanças o gancho da corda. Ao terceiro lance, prende-se no varandim de ferro lá em cima. Começas a subir pela parede molhada, com o vento a tentar arrancar-te dali.`,
 teste: { tipo: 'hab', ok: 'galeria', ko: 'escalar_cai' } },

escalar_cai: { cena: 'farol', lugar: 'farol', som: 'queda', fx: { en: -4, drop: 'Corda de Cânhamo' }, t: `A meio da parede, a corda roça numa aresta e rebenta. Escorregas vários metros e bates no chão de lado. Perdes 4 pontos de Energia, e a corda ficou inútil.`,
 ch: [c('Levantar-te a custo', 'portafarol')] },

/* ===================== CAPÍTULO III · A GRUTA AFOGADA ===================== */
praia: { cap: 'III · A Gruta Afogada', cena: 'praia', lugar: 'praia', fxA: { mare: 1 }, t:
`A praia é uma língua de areia escura que a maré já começou a comer. A entrada da Gruta Afogada é alta como uma igreja, e lá dentro a escuridão é total. De muito longe, do fundo, vem um som abafado: o mar a bater em metal, como um sino tocado debaixo de água.

Não se vê um palmo à frente da cara. Sem luz, lá dentro estás cego.`,
 ch: [c('Acender a lanterna de furacão e entrar', 'gruta1', { req: 'Lanterna de Furacão' }), c('Entrar com o archote aceso', 'gruta1', { luzArchote: 1, notItem: 'Lanterna de Furacão' }), c('Entrar às escuras, às apalpadelas', 'perdido1', { semLuz: 1 }), c('Subir de volta pelo carreiro', 'falesia1')] },

gruta1: { cena: 'gruta', lugar: 'gruta', escuro: 1, t:
`A tua luz desenha a gruta à tua volta. A água chega-te aos joelhos e está gelada. As paredes brilham de limos e de caranguejos pequenos que fogem da claridade.

À esquerda, de um túnel, vem um canto doce de mulher. À direita, de outro túnel, vem o som do bronze. Em frente, a água fica negra e funda, num poço.

E na rocha, mesmo ao lado da tua mão, alguém gravou um corvo pequeno, com o bico a apontar para o fundo da gruta. Sem luz, nunca o terias visto.`,
 ch: [c('Seguir o canto pelo túnel da esquerda', 'moira', { notFlag: 'moira' }), c('Seguir o som do bronze pelo túnel da direita', 'sino_sala', { notItem: 'Badalo de Bronze' }), c('Mergulhar no poço', 'poco', { notFlag: 'poco' }), c('Seguir as marcas do corvo', 'marcas'), c('Sair para a praia', 'praia')] },

marcas: { cena: 'gruta', lugar: 'gruta', escuro: 1, t:
`Segues os corvos gravados de rocha em rocha. São pequenos e fáceis de perder. Ao fim de um corredor estreito, há dois: um aponta para uns degraus cortados na pedra, que sobem. O outro tem uma cruz riscada por cima e aponta para uma passagem baixa, de onde vem um cheiro doce e enjoativo, como flores a apodrecer.`,
 ch: [c('Subir os degraus para onde aponta o corvo', 'degraus', { flag: 'marcas' }), c('Entrar na passagem marcada com a cruz', 'ossario', { flag: 'marcas' }), c('Escolher um dos caminhos ao acaso', 'marcas_teste', { notFlag: 'marcas' })] },

marcas_teste: { cena: 'gruta', lugar: 'gruta', t: `Não sabes o que as marcas querem dizer. Uma tem uma cruz, a outra não. Escolhes uma e esperas não te arrepender.`,
 teste: { tipo: 'sorte', ok: 'degraus', ko: 'ossario' } },

perdido1: { cena: 'galerias', lugar: 'galerias', fxA: { mare: 1 }, t:
`Avanças às apalpadelas, com uma mão na rocha e a outra à frente da cara. A entrada da gruta desaparece atrás de ti ao fim de vinte passos. A água sobe-te até à cintura, depois desce.

Já não sabes para que lado fica o mar. Algures à tua esquerda, uma coisa grande desliza na água sem fazer ondas.`,
 ch: [c('Seguir a parede da esquerda', 'perdido2'), c('Seguir o barulho de água a correr', 'perdido3')] },

perdido2: { cena: 'galerias', lugar: 'galerias', som: 'rugido', fxA: { mare: 1 }, t:
`A parede faz uma curva e acaba num lago. Ouves a água abrir-se. Uma coisa lisa e gelada enrola-se-te nas pernas, depois outra. ENGUIAS CEGAS, grossas como braços, de bocas cheias de dentes virados para dentro.

Não as vês. Tens de lutar pelo tacto.`,
 luta: { foes: [{ nome: 'Enguias Cegas', hab: 7, en: 8 }], win: 'perdido4', ceguinho: 1 } },

perdido3: { cena: 'galerias', lugar: 'galerias', fxA: { mare: 1, en: -2 }, t:
`Segues o barulho da água. O chão desaparece-te debaixo dos pés e cais num canal fundo. A corrente leva-te, bate-te contra as rochas, enfia-te por um túnel onde mal cabes, e deita-te noutro sítio igualmente escuro.

Tossindo, sobes para uma pedra.`,
 ch: [c('Gatinhar para onde o ar parece mais fresco', 'perdido4')] },

perdido4: { cena: 'galerias', lugar: 'galerias', fxA: { mare: 1 }, t:
`Ao fim de não sabes quanto tempo, vês uma claridade cinzenta. Arrastas-te para ela de joelhos.

Sais na mesma praia por onde entraste. A maré subiu muito. Perdeste tempo e forças a andar às voltas no escuro, e não encontraste nada.

Lá dentro, sem luz, não há caminho. Precisas de uma lanterna, ou pelo menos de um archote.`,
 ch: [c('Recuperar o fôlego na praia', 'praia')] },

apagou: { cena: 'galerias', lugar: 'galerias', t:
`A chama do archote encolhe, fica azul, estala e apaga-se. O escuro cai-te em cima como água.

Ficas parado, à escuta. Ouves a tua respiração, o mar ao longe, e uma coisa a mexer-se na água, perto.`,
 ch: [c('Tentar encontrar o caminho de volta às apalpadelas', 'perdido1')] },

moira: { cena: 'moira', lugar: 'moira', fx: { flag: 'moira' }, t:
`O túnel abre-se numa câmara onde a água é limpa e verde-clara, iluminada de baixo como se houvesse sol no fundo do mar. Sentada numa pedra, uma mulher penteia cabelos que lhe descem até à água. Tem a pele cor de pérola e, em vez de pernas, uma cauda de escamas: é uma MOIRA DAS ÁGUAS.

Canta, e o canto puxa-te para ela como uma corda ao pescoço. Dás um passo para a água sem querer. Depois outro.`,
 ch: [c('Agarrar o búzio que trazes ao peito', 'moira_amuleto', { req: 'Amuleto de Búzio' }), c('Cravar as unhas nas mãos e resistir ao canto', 'moira_teste', { notItem: 'Amuleto de Búzio' })] },

moira_teste: { cena: 'moira', lugar: 'moira', t: `Cravas as unhas nas palmas e tentas pensar em qualquer outra coisa: no frio, no farol, no barqueiro. O canto continua, cada vez mais doce.`,
 teste: { tipo: 'sorte', ok: 'moira_resiste', ko: 'moira_cai' } },

moira_cai: { cena: 'moira', lugar: 'moira', som: 'splash', fx: { en: -4, mare: 2 }, t:
`Quando dás por ti, estás com água pelo pescoço e a moira estende-te os braços. Arrancas-te dali aos tropeções, a tossir água salgada. Ela ri-se e mergulha.

Perdeste forças e tempo: menos 4 de Energia, e a maré subiu mais 2.`,
 ch: [c('Voltar à entrada da gruta', 'gruta1')] },

moira_resiste: { cena: 'moira', lugar: 'moira', t: `O canto escorrega-te pelos ouvidos sem te prender. A moira cala-se e olha-te com curiosidade, inclinando a cabeça como uma gaivota.`,
 ch: [c('Ouvir o que ela tem para dizer', 'moira_fala')] },

moira_amuleto: { cena: 'moira', lugar: 'moira', som: 'sorte', t:
`O búzio começa a zumbir contra o teu peito, como uma concha encostada ao ouvido, e o canto da moira desfaz-se nesse som de mar. Ela pára, surpreendida, e olha para o amuleto.

— É do Joaquim — diz. — Ele cantava melhor do que eu. Então podemos conversar.`,
 ch: [c('Ouvir o que ela tem para dizer', 'moira_fala')] },

moira_fala: { cena: 'moira', lugar: 'moira', t:
`— O Vidal envenenou-me as águas — diz ela. — Desde que voltou, os peixes fogem e os mortos não descansam. Guarda as almas deles em frascos, no ossário, atrás da marca do corvo com a cruz. Partir os frascos liberta-as. Mas o ossário tem um guarda.

Penteia o cabelo devagar.

— O sino desfaz-lhe a pele. O nome desfaz-lhe a vontade. Se o vais enfrentar, ajudo-te. Mas no mar nada se dá de graça. Dá-me alguma coisa que brilhe.`,
 fx: { flag: 'dica_moira' },
 ch: [c('Dar-lhe 5 moedas', 'moira_perola', { ouro: 5 }), c('Dar-lhe o Dente de Tubarão', 'moira_perola2', { req: 'Dente de Tubarão' }), c('Recusar e voltar à entrada da gruta', 'gruta1')] },

moira_perola: { cena: 'moira', lugar: 'moira', som: 'sorte', fx: { ouro: -5, item: 'Pérola Negra' }, t:
`A moira morde uma moeda, sorri e esconde as outras no cabelo. Depois entrega-te uma pérola negra do tamanho de um ovo de pomba.

— Quando estiveres às portas da morte, parte-a entre os dentes.`,
 ch: [c('Guardar a pérola e voltar à entrada', 'gruta1')] },

moira_perola2: { cena: 'moira', lugar: 'moira', som: 'sorte', fx: { drop: 'Dente de Tubarão', item: 'Pérola Negra' }, t:
`A moira examina o dente contra a luz e passa-o pelo cabelo como um pente. Fica satisfeita e entrega-te uma pérola negra do tamanho de um ovo de pomba.

— Quando estiveres às portas da morte, parte-a entre os dentes.`,
 ch: [c('Guardar a pérola e voltar à entrada', 'gruta1')] },

sino_sala: { cena: 'sino', lugar: 'sino', escuro: 1, som: 'garras', t:
`O túnel desce até uma câmara redonda. No centro, meio enterrado na areia e coberto de cracas, está um sino de bronze maior do que tu: o Sino de Santa Bárbara. O badalo ainda lá está dentro.

Mas a areia à volta mexe-se. Primeiro surgem duas antenas compridas como chicotes. Depois duas pinças do tamanho de portas. Depois uma carapaça cor de ferrugem, cheia de espinhos. O CARANGUEJO-REI sai da areia e põe-se entre ti e o sino.`,
 luta: { foes: [{ nome: 'Caranguejo-Rei', hab: 9, en: 10 }], win: 'sino_ganho', fuga: 'gruta1', fugaApos: 3 } },

sino_ganho: { cena: 'sino', lugar: 'sino', som: 'sinogrande', fx: { item: 'Badalo de Bronze' }, t:
`O caranguejo tomba de lado e as patas param de se mexer. Rastejas para debaixo do sino e, com muito esforço, soltas o badalo de bronze, pesado como uma maça de guerra.

Quando lhe tocas, sentes-o vibrar, como se se lembrasse de todas as horas que tocou. Lá em cima, muito longe, julgas ouvir alguém gritar.`,
 ch: [c('Voltar à entrada da gruta', 'gruta1')] },

poco: { cena: 'gruta', lugar: 'poco', escuro: 1, fx: { flag: 'poco' }, t: `Pousas a luz numa pedra, respiras fundo e mergulhas no poço negro. A água aperta-te as têmporas. Lá em baixo, a claridade mal chega.`,
 teste: { tipo: 'hab', ok: 'poco_ok', ko: 'poco_ko' } },

poco_ok: { cena: 'gruta', lugar: 'poco', som: 'chave', fx: { ouro: 12, item: 'Óleo de Baleia' }, t:
`No fundo, entre ossos e madeira podre, encontras um baú de marinheiro. Abres a tampa à força. Doze moedas de ouro, e uma bilha de óleo de baleia, ainda selada. Alguém a guardou aqui para um dia de necessidade.

Sobes à superfície a rir.`,
 ch: [c('Voltar à entrada da gruta', 'gruta1')] },

poco_ko: { cena: 'gruta', lugar: 'poco', som: 'splash', fx: { en: -3 }, t: `Uma corrente fria agarra-te as pernas e puxa-te para baixo. Bates com a cabeça numa rocha e sobes à tona a sangrar. Perdes 3 pontos de Energia.`,
 ch: [c('Sair do poço', 'gruta1')] },

ossario: { cena: 'ossario', lugar: 'ossario', escuro: 1, som: 'ameaca', fxA: { mare: 1 }, t:
`A passagem dá para uma sala comprida, escavada na rocha. As paredes estão cheias de nichos, e os nichos estão cheios de frascos de vidro verde, centenas deles. Dentro de cada frasco brilha uma luzinha pálida que bate contra o vidro como uma traça.

São almas. Algumas chamam por nomes.

Ao fundo da sala, o que tomaste por um monte de coral mexe-se. Levanta-se. É uma figura enorme, curvada, de braços que lhe chegam ao chão, com a cabeça e os ombros cobertos de ramos de coral. O GUARDIÃO DE CORAL abre dois olhos que brilham como os frascos.`,
 luta: { foes: [{ nome: 'Guardião de Coral', hab: 9, en: 12 }], win: 'ossario_ganho', fuga: 'gruta1', fugaApos: 3 } },

ossario_ganho: { cena: 'ossario', lugar: 'ossario', som: 'sinogrande', fx: { flag: 'almas', sorteMax: 1 }, t:
`O guardião desfaz-se num monte de coral partido. Começas a partir os frascos, um a um. Cada luzinha que sai sobe ao teto, dá uma volta à tua cabeça e desaparece pela rocha, a caminho do mar.

Do último frasco sai uma luz que não se vai embora. Fica à tua frente e ganha a forma de um rapaz.

— Sou o Joaquim. Diz à minha mãe que eu estou bem. E ouve: ele não tem medo da espada. Tem medo de ser lembrado. Quando estiveres diante dele, nós vamos estar contigo.

A Sorte volta toda ao teu corpo.`,
 ch: [c('Seguir pela passagem do outro lado do ossário', 'degraus')] },

degraus: { cena: 'gruta', lugar: 'gruta', escuro: 1, som: 'porta', fxA: { mare: 1 }, t:
`Os degraus sobem em caracol por dentro da rocha, escorregadios de limo. Contas cento e doze até chegares a um alçapão de madeira por cima da tua cabeça.

Empurras com o ombro. Cede.`,
 ch: [c('Entrar no farol', 'base')] },

/* ===================== CAPÍTULO IV · A TORRE ===================== */
base: { cap: 'IV · A Torre', cena: 'torre', lugar: 'torre', t:
`Estás na base do farol. Uma escada de ferro em caracol sobe pelo centro da torre e perde-se no escuro, duzentos degraus acima. Ao lado, uma porta pequena dá para a arrecadação, e no chão está o alçapão para a gruta.

Lá de cima vem um cheiro a algas podres e, de vez em quando, um gemido humano. A escada vibra, como se alguém estivesse a andar nela.`,
 ch: [c('Subir a escada de ferro', 'escada'), c('Entrar na arrecadação', 'arrecad', { notFlag: 'arrecad' }), c('Descer pelo alçapão até à gruta', 'gruta1', { luz: 1 }), c('Sair pela porta principal', 'portafarol')] },

arrecad: { cena: 'torre', lugar: 'torre', fx: { flag: 'arrecad', prov: 2 }, t:
`Entre redes, latas de tinta e um barril de óleo rachado e vazio, encontras um saco com pão duro e chouriço. Ganhas 2 Provisões.

Num canto há um pipo com um dedo de óleo no fundo. Não chega para uma noite inteira, mas talvez chegue para umas horas, se for preciso.`,
 ch: [c('Voltar à base da torre', 'base')] },

escada: { cena: 'torre', lugar: 'torre', som: 'sopro', fxA: { mare: 1 }, t:
`Sobes. Os degraus de ferro tremem a cada passo e o eco repete-os lá em cima, um bocadinho atrasado, como se alguém subisse a imitar-te.

A meio da torre, a escada passa por uma janela estreita. Do vidro desprende-se uma sombra húmida, da forma de um homem, feita de sal e de espuma: uma SOMBRA SALGADA. Onde te toca, a pele arde e racha.`,
 luta: { foes: [{ nome: 'Sombra Salgada', hab: 8, en: 7 }], win: 'patamar' } },

patamar: { cena: 'torre', lugar: 'torre', t:
`A sombra desfaz-se em sal, que cai pela escada abaixo a tilintar como areia em vidro.

Os últimos degraus. Por cima de ti, uma porta entreaberta deixa sair uma luz verde e doentia. Ouves uma voz de homem, calma e agradável, a cantarolar. E ouves correntes a arrastar no chão.

Encostas-te à parede e respiras fundo. É agora.`,
 ch: [c('Entrar na sala da lanterna', 'topo')] },

galeria: { cena: 'lanterna', lugar: 'lanterna', t:

 const extra = L.ronda === 0 && s.ch_extra ? s.ch_extra.filter(c => cond(c) === null).map(c => `<button class="b" data-ir="${c.to}">${c.t}</button>`).join('') : '';
 h += `<div class="acoes"><button class="b prim" data-a="atacar">Atacar</button>${extra}${L.sorteOk ? `<button class="b" data-a="sorteluta">Testar a Sorte neste golpe</button>` : ''}${tem('Faca de Arremesso') ? `<button class="b" data-a="faca">Atirar a faca</button>` : ''}${l.fuga ? `<button class="b" data-a="fugir" ${podeFugir ? '' : 'disabled'}>Fugir (−2 En)${podeFugir ? '' : ` após ${l.fugaApos} ${l.fugaApos === 1 ? 'ronda' : 'rondas'}`}</button>` : ''}</div>`;
 return h + `<p class="nota" style="margin:10px 0 0">Cada ronda lançam-se dois dados para cada lado e soma-se a Habilidade. Quem tiver o total maior acerta e tira 2 de Energia ao outro.</p></div>`; }

const VOL_TXT = ['Sem som', 'Volume baixo', 'Volume médio', 'Volume alto'];
function volIcone(n) { const ondas = [n >= 1 ? '<path d="M15 9.5a3.5 3.5 0 0 1 0 5"/>' : '', n >= 2 ? '<path d="M17.5 7a7 7 0 0 1 0 10"/>' : '', n >= 3 ? '<path d="M20 4.5a10.5 10.5 0 0 1 0 15"/>' : ''].join('');
 return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3l4.5-4v13L7 14.5H4z" fill="currentColor"/>${ondas}${n === 0 ? '<path d="M15.5 9.5l5 5M20.5 9.5l-5 5"/>' : ''}</svg>`; }
const volBtn = () => `<button class="tb vol" data-a="vol" aria-label="${VOL_TXT[Som.nivel]}. Tocar para mudar" title="${VOL_TXT[Som.nivel]}">${volIcone(Som.nivel)}</button>`;
function barHTML() { $('#bar').innerHTML = st ? `<span class="nome">O Farol do Corvo</span><div class="strip"><span><b>Hab</b>${st.hab}</span><span><b>En</b>${st.en}</span><span><b>Sor</b>${st.sorte}</span><span class="mr"><b>Maré</b>${st.mare}/${st.limite}</span></div><div class="dir">${volBtn()}<button class="tb so-movel" data-a="folha">Folha</button><button class="tb" data-a="menu">Menu</button></div>` : `<span class="nome">O Farol do Corvo</span><div class="dir">${volBtn()}</div>`; }
function folhaHTML() { const emLuta = st.luta && !st.luta.ganhou && !st.morto, P = st.pocao;
 $('#folha').innerHTML = `<div class="ficha"><div class="folha-tit"><span>Folha de Aventuras</span><button class="fechar" data-a="fechar" aria-label="Fechar">×</button></div>
 <div class="trio"><div class="cx"><div class="lab">Habilidade</div><div class="val">${st.hab}</div><div class="ini">inicial ${st.habI}</div></div><div class="cx"><div class="lab">Energia</div><div class="val" style="${st.en <= 4 ? 'color:var(--sangue)' : ''}">${st.en}</div><div class="ini">inicial ${st.enI}</div></div><div class="cx"><div class="lab">Sorte</div><div class="val">${st.sorte}</div><div class="ini">inicial ${st.sorteI}</div></div></div>
 <div class="sec"><h4>Maré · ${st.mare} de ${st.limite}</h4><div class="mare" style="grid-template-columns:repeat(${st.limite},1fr)">${Array.from({ length: st.limite }, (_, i) => `<i class="${i < st.mare ? 'on' : ''} ${i >= st.limite - 3 ? 'alto' : ''}"></i>`).join('')}</div><p class="nota" style="margin:0">A frota entra quando a maré encher. Cada desvio custa tempo.</p></div>
 <div class="sec"><div class="linha2"><span>Ouro: <b style="font-family:var(--f-num);font-size:1.15rem">${st.ouro}</b> moedas</span></div>
 <div class="linha2"><span>Provisões: <b style="font-family:var(--f-num);font-size:1.15rem">${st.prov}</b></span><button class="mini" data-a="comer" ${st.prov <= 0 || st.en >= st.enI || emLuta || st.morto ? 'disabled' : ''}>Comer (+4 En)</button></div>
 ${P ? `<div class="linha2"><span>${POCOES[P.tipo].nome}<small style="display:block;color:var(--tinta2);font-size:.78rem;font-style:italic">${P.doses} ${P.doses === 1 ? 'dose' : 'doses'} · ${POCOES[P.tipo].d}</small></span><button class="mini" data-a="beber" ${P.doses <= 0 || st.morto ? 'disabled' : ''}>Beber</button></div>` : ''}
 ${st.archote > 0 && !temLanterna() ? `<div class="linha2"><span>Archote aceso <span class="chama">${Array.from({ length: 6 }, (_, k) => `<i class="${k < st.archote ? '' : 'gasta'}"></i>`).join('')}</span></span></div>` : ''}</div>
 <div class="sec"><h4>Equipamento</h4><ul class="itens"><li>Espada e armadura de couro</li>${st.itens.map(i => `<li class="linha2"><span>${i}<small>${ITENS[i] || ''}</small></span>${i === 'Pérola Negra' ? `<button class="mini" data-a="perola" ${st.morto ? 'disabled' : ''}>Usar</button>` : ''}</li>`).join('')}</ul></div>
 ${st.dedosI > 0 ? `<div class="sec"><h4>Dedo no livro</h4><div class="linha2"><span class="dedos">${Array.from({ length: st.dedosI }, (_, k) => `<i class="${k < st.dedos ? '' : 'gasto'}"></i>`).join('')}</span><button class="mini" data-a="dedo" ${st.dedos <= 0 || !st.undo.length ? 'disabled' : ''}>Voltar atrás</button></div></div>` : ''}
 <div class="sec"><h4>Rasto</h4><div class="rasto">${st.rasto.slice(-40).map(n => `<span>${n}</span>`).join('')}</div></div></div>
 <div class="ficha mapa"><div class="tit"><h4>Mapa da ilha</h4><button class="mini" data-a="mapa">Ampliar</button></div>${mapaSVG(false)}</div>
 <div class="ficha"><div class="opc"><h4 style="margin:0 0 4px;font-family:var(--f-tit);font-weight:400;font-size:1.1rem">Som e voz</h4>
 <label for="o-vol-txt">Volume: ${VOL_TXT[Som.nivel]}<button class="mini" id="o-vol-txt" data-a="vol">Mudar</button></label>
 <label for="o-mus">Música de fundo<input type="checkbox" id="o-mus" ${Som.musica ? 'checked' : ''}></label>
 ${Voz.ok ? `<label for="o-voz">Narrador lê as páginas<input type="checkbox" id="o-voz" ${Voz.on ? 'checked' : ''}></label>` : ''}
 <p class="nota" style="margin:2px 0 0">Melhor com auscultadores. A voz do narrador depende do teu dispositivo.</p></div></div>`; }

function mapaSVG(grande) { const vis = st.locs || {}, atual = S[st.sec].lugar, LG = Historia.LUGARES;
 let h = `<svg viewBox="0 0 310 400" role="img" aria-label="Mapa da Ilha do Corvo"><defs><filter id="tm"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
 <rect x="2" y="2" width="306" height="396" fill="none" stroke="#160f07" stroke-width="1.5"/><rect x="6" y="6" width="298" height="388" fill="none" stroke="#160f07" stroke-width=".6"/><g filter="url(#tm)" fill="none" stroke="#160f07">
 <path d="M60 395 Q45 340 22 300 Q8 262 24 236 Q60 204 90 160 Q110 110 150 80 Q180 42 215 22 Q252 12 270 40 Q306 80 304 140 Q300 200 304 250 Q306 300 292 340 Q272 384 250 395" stroke-width="1.8"/>
 ${[[20, 120], [40, 170], [30, 70], [110, 40], [150, 24], [296, 330], [284, 380], [200, 392], [105, 392]].map(([x, y]) => `<path d="M${x} ${y} q4 -4 8 0 q4 4 8 0" stroke-width=".9"/>`).join('')}
 <circle cx="36" cy="362" r="14" stroke-width=".8"/><path d="M36 343 L40 362 L36 381 L32 362 Z M17 362 L36 358 L55 362 L36 366 Z" fill="#160f07" stroke-width=".6"/></g>
 <text x="36" y="340" text-anchor="middle" font-family="IM Fell English SC, serif" font-size="10" fill="#160f07">N</text>
 <text x="14" y="32" font-family="IM Fell English SC, serif" font-size="17" fill="#160f07">Ilha do Corvo</text><text x="14" y="47" font-family="IM Fell English, serif" font-style="italic" font-size="9.5" fill="#4f3c22">mapa do forasteiro</text>`;
 Historia.CAMINHOS.forEach(([a, b]) => { if (vis[a] && vis[b]) { const A = LG[a], B = LG[b]; h += `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#4f3c22" stroke-width=".8" stroke-dasharray="1.5 4" stroke-linecap="round"/>`; } });
 const cam = (st.caminho || []).slice(-14); for (let i = 1; i < cam.length; i++) { const A = LG[cam[i - 1]], B = LG[cam[i]]; if (!A || !B) continue; const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy) || 1, ang = Math.atan2(dy, dx) * 180 / Math.PI + 90, nx = -dy / len, ny = dx / len, op = (.25 + .75 * i / (cam.length - 1)).toFixed(2);
  for (let s = 10, k = 0; s < len - 8; s += 9, k++) { const sd = k % 2 ? 2.4 : -2.4, x = A[0] + dx * s / len + nx * sd, y = A[1] + dy * s / len + ny * sd; h += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="1.3" ry="2.3" transform="rotate(${ang.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="#160f07" opacity="${op}"/>`; } }
 Object.entries(LG).forEach(([k, [x, y, nome, an]]) => { if (!vis[k]) return; const nv = Novo.loc === k && !grande ? ' loc-novo' : ''; let tx = x + 8, ty = y + 3.5, ta = 'start'; if (an === 'e') { tx = x - 8; ta = 'end'; } if (an === 'b') { tx = x; ty = y + 15; ta = 'middle'; } if (an === 'a') { tx = x; ty = y - 8; ta = 'middle'; }
  h += `<g class="${nv}"><circle cx="${x}" cy="${y}" r="3.4" fill="#160f07"/><circle cx="${x}" cy="${y}" r="6" fill="none" stroke="#160f07" stroke-width=".7"/><text x="${tx}" y="${ty}" text-anchor="${ta}" font-family="IM Fell English, serif" font-size="10.5" fill="#160f07">${nome}</text></g>`; });
 if (atual && LG[atual]) { const [x, y] = LG[atual]; h += `<circle class="aqui" cx="${x}" cy="${y}" r="8" fill="#8b2716" opacity=".85"/><circle cx="${x}" cy="${y}" r="3" fill="#e2cb98"/>`; }
 return h + '</svg>'; }
function abrirMapa(v) { const m = $('#mapaGrande'); if (!v) { m.hidden = true; m.innerHTML = ''; return; } m.innerHTML = `<div class="folhamapa"><div class="linha2"><span style="font-family:var(--f-tit);font-size:1.3rem">Mapa da ilha</span><button class="mini" data-a="fecharmapa">Fechar</button></div>${mapaSVG(true)}<p class="nota" style="margin:6px 0 0">Os lugares aparecem a tinta à medida que os descobres. As pegadas mostram o teu caminho mais recente.</p></div>`; m.hidden = false; }

function capa(novo) { const sv = carregarJogo(), f = finais(), n = Object.keys(FINAIS).filter(k => f[k]).length;
 $('#topo').innerHTML = ''; Ilus.mostrar('farol', novo !== false);
 $('#corpo').innerHTML = `<div class="capa fade"><h1>O Farol do Corvo</h1><p class="sub">Um livro-jogo em que tu és o herói. Uma noite, uma ilha, uma maré a subir.</p>
 <div class="acoes">${sv && !sv.fim && !sv.morto ? `<button class="b prim" data-a="continuar">Continuar na secção ${NUM[sv.sec]}</button>` : ''}<button class="b ${sv && !sv.fim && !sv.morto ? '' : 'prim'}" data-a="criar">Nova aventura</button></div>
 <p class="nota" style="margin-top:14px">Finais descobertos: ${n} de ${Object.keys(FINAIS).length}</p><p class="nota"><a href="en.html" style="color:inherit">Play in English</a></p>
 <p class="aviso-som">Joga com som. O botão do altifalante, em cima, muda o volume.</p>
 <details class="regras"><summary>Como se joga</summary>
 <p>Lês uma secção e escolhes o que fazer. Cada escolha manda-te para outra secção numerada, como nos livros-jogo de antigamente. O jogo trata dos saltos, dos dados e da Folha de Aventuras.</p>
 <ul><li><b>Habilidade</b>: a tua mestria com a espada.</li><li><b>Energia</b>: a tua vida. Se chegar a zero, morres.</li><li><b>Sorte</b>: lanças dois dados e precisas de tirar igual ou menos. Cada teste gasta 1 ponto.</li><li><b>Maré</b>: tens até a maré encher para acender o farol. Perder tempo tem consequências.</li><li><b>Luz</b>: há lugares onde, sem luz, não vês o caminho. Um archote apaga-se ao fim de pouco tempo.</li><li><b>Dedo no livro</b>: podes voltar atrás algumas vezes, como quem deixa o dedo na página.</li></ul>
 <p>Os objetos e as pistas que encontras abrem caminhos novos. Sem eles, andas perdido. Só há um caminho para o melhor final.</p></details></div>`; }
function rolarCr() { const h = rol(1), e = rol(2), s = rol(1); Object.assign(cr, { h, e, s, hab: 6 + h[0], en: 12 + soma(e), sorte: 6 + s[0] }); Som.fx('dados'); }
function criar() { if (!cr.h) rolarCr(); if (!cr.modo) cr.modo = 'normal'; $('#topo').innerHTML = '';
 $('#corpo').innerHTML = `<div class="fade"><h2 class="titulo2" style="font-size:2rem;text-align:center;margin-top:0">A tua personagem</h2><p style="text-align:center">Os dados decidem quem és. Se não gostares, lança outra vez.</p>
 <div class="criar rola"><div class="cx"><div class="lab">Habilidade</div><div class="val">${cr.hab}</div>${dados(cr.h)}<div class="ini">1 dado + 6</div></div><div class="cx"><div class="lab">Energia</div><div class="val">${cr.en}</div>${dados(cr.e)}<div class="ini">2 dados + 12</div></div><div class="cx"><div class="lab">Sorte</div><div class="val">${cr.sorte}</div>${dados(cr.s)}<div class="ini">1 dado + 6</div></div></div>
 <div class="acoes" style="justify-content:center"><button class="b" data-a="relancar">Lançar outra vez</button></div>
 <h3 class="titulo2">Modo de jogo</h3><div class="grelha3">${Object.entries(MODOS).map(([k, m]) => `<button class="opcao ${cr.modo === k ? 'sel' : ''}" data-modo="${k}" aria-pressed="${cr.modo === k}"><b>${m.nome}</b><small>${m.d}</small></button>`).join('')}</div>
 <h3 class="titulo2">Escolhe uma poção (2 doses)</h3><div class="grelha3">${Object.entries(POCOES).map(([k, p]) => `<button class="opcao ${cr.pocao === k ? 'sel' : ''}" data-pocao="${k}" aria-pressed="${cr.pocao === k}"><b>${p.nome}</b><small>${p.d}</small></button>`).join('')}</div>
 <div class="acoes" style="margin-top:20px"><button class="b prim" data-a="comecar" ${cr.pocao ? '' : 'disabled'}>${cr.pocao ? 'Começar a aventura' : 'Escolhe uma poção para começar'}</button><button class="b" data-a="capa">Voltar</button></div></div>`; }
function comecar() { const M = MODOS[cr.modo]; st = { modo: cr.modo, limite: M.limite, inim: M.inim, habI: cr.hab, hab: cr.hab, enI: cr.en, en: cr.en, sorteI: cr.sorte, sorte: cr.sorte, ouro: M.ouro, prov: M.prov, pocao: { tipo: cr.pocao, doses: 2 }, itens: [], flags: {}, visto: { start: 1 }, mare: 0, rasto: [1], dedos: M.dedos, dedosI: M.dedos, undo: [], sec: 'start', luta: null, res: null, morto: false, fim: null, locs: { cais: 1 }, caminho: ['cais'], archote: 0 };
 cr = null; Novo.loc = 'cais'; guardar(); Som.desbloquear(); Som.fx('pagina'); render(true, false, true);
 Ilus.aquecer(['taberna', 'capela', 'casa', 'cemiterio', 'falesia', 'afogado', 'praia', 'gruta', 'galerias', 'ninhos', 'farol', 'avejao', 'moira', 'sino', 'ossario', 'torre', 'lanterna', 'rei', 'aceso', 'naufragio']); }

function abrirFolha(v) { $('#folha').classList.toggle('aberta', v); $('#veu').hidden = !v; }
document.addEventListener('click', e => {
 if (e.target.closest('#ilus')) { Ilus.acabar(); return; }
 if (e.target.id === 'mapaGrande') { abrirMapa(false); return; }
 const b = e.target.closest('button'); if (!b || b.disabled) return;
 Som.desbloquear();
 if (b.dataset.ir) { abrirFolha(false); ir(b.dataset.ir); return; }
 if (b.dataset.compra != null) { comprar(+b.dataset.compra); return; }
 if (b.dataset.pocao) { cr.pocao = b.dataset.pocao; criar(); return; }
 if (b.dataset.modo) { cr.modo = b.dataset.modo; criar(); return; }
 ({ testar, duelo: duelar, atacar, sorteluta: sorteLuta, faca, fugir, comer, beber, perola, dedo, comecar,
  folha: () => abrirFolha(true), fechar: () => abrirFolha(false), mapa: () => abrirMapa(true), fecharmapa: () => abrirMapa(false),
  vol: () => { Som.ciclo(); if (st) { barHTML(); folhaHTML(); render(); } else { barHTML(); Som.cena('falesia', 'explorar'); } Som.fx('pagina'); },
  menu: () => { guardar(); Voz.parar(); st = null; cr = null; abrirFolha(false); Som.coracao(false); Som.cena('falesia', 'explorar'); render(false); },
  capa: () => { cr = null; render(false); },
  continuar: () => { st = carregarJogo(); Novo.loc = null; render(true, false, true); },
  criar: () => { cr = {}; Som.cena('porto', 'explorar'); render(false); },
  relancar: () => { rolarCr(); criar(); },
  nova: () => { st = null; cr = {}; abrirFolha(false); Voz.parar(); Som.coracao(false); render(false); },
 }[b.dataset.a] || (() => { }))();
});
document.addEventListener('change', e => { if (e.target.id === 'o-mus') Som.setMusica(e.target.checked); if (e.target.id === 'o-voz') { Voz.set(e.target.checked); if (e.target.checked && st) Voz.ler(S[st.sec].t); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { abrirMapa(false); abrirFolha(false); } });
$('#veu').addEventListener('click', () => abrirFolha(false));
render(true);
if ('serviceWorker' in navigator && !/claude|anthropic/.test(location.hostname)) { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }
</script>
