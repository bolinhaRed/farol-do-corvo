start: { cap: 'I · Vila Negra', cena: 'cais', lugar: 'cais', t:
`O barco do correio larga-te no cais de Vila Negra quando o sol já se afoga no mar. Ninguém te espera. As redes estão estendidas mas não há pescadores, e as janelas da aldeia estão todas fechadas, apesar de ainda não ser noite.

Lá em cima, na ponta da ilha, o Farol do Corvo está apagado há três noites. Nesse tempo, quatro barcos partiram-se nos Dentes, os rochedos que fecham a baía. A Câmara de Porto Alto pagou-te para descobrir o que aconteceu ao faroleiro, Mestre Anselmo, e voltar a acender a luz antes da maré grande desta noite.

O barqueiro não te ajudou a sair do barco. Agora estende-te uma moeda. Tem as unhas azuladas, e a mão, quando lhe tocas sem querer, está fria como um peixe.

`— Vens por causa do farol — diz ela, antes de abrires a boca. — Há quatro noites apareceu aqui um homem que eu nunca tinha visto. Alto, de capa verde-escura a brilhar como pele de enguia. Pagou com moedas cobertas de sal e disse que se chamava Dom Vidal. Na noite seguinte, o farol apagou-se.

`— Os ossos gostam de mim — diz Tomé, enfiando as tuas moedas na algibeira. — Não leves a mal. Toma lá um conselho de borla: na gruta, segue o corvo. O Anselmo marcava tudo com um corvo. E onde o corvo tem uma cruz por cima, não entres.`,

archote: { cena: 'taberna', lugar: 'taberna', fx: { flag: 'archote', archote: 5 }, t:
`Escolhes um pau de pinho com a ponta embebida em resina e acendes-lo nas brasas. Dona Rosário vê-te, mas não diz nada.

Um dos pescadores fala pela primeira vez, sem levantar os olhos do copo:

— Isso não dura muito. Lá em baixo, quando se apaga, apaga-se de vez.`,
 ch: [c('Voltar ao balcão', 'taberna')] },

loja: { cena: 'taberna', lugar: 'taberna', t: `Dona Rosário abre a despensa e mostra o que tem. Não faz descontos, mas também não engana ninguém.`,

capela: { cena: 'capela', lugar: 'capela', zona: 'aldeia', t:
`A Capela de São Pedro dos Náufragos é pequena e fria. A luz da lua entra pela janela alta e cai sobre o altar. Das traves pendem dezenas de barquinhos de madeira, oferecidos por quem voltou do mar. Nas paredes há retratos de quem não voltou.

Uma mulher vestida de negro reza ajoelhada diante do altar. Ao lado da sacristia, uma porta baixa, de ferro, dá para a cripta. Está entreaberta.`,
 alt: [{ flag: 'cerco', t:
`As velas da capela apagaram-se todas. Os barquinhos de madeira das traves estão encharcados e pingam, como se tivessem estado no mar. Há algas no altar.

A mulher de negro continua ajoelhada, no mesmo sítio, a rezar muito depressa.` }],
 ch: [c('Ajoelhar-te e rezar', 'rezar', { notFlag: 'rezou' }), c('Falar com a mulher de negro', 'beata', { notFlag: 'beata' }), c('Ler os papéis presos aos ex-votos', 'exvotos', { notFlag: 'exvotos' }), c('Descer à cripta', 'cripta', { notFlag: 'cripta' }), c('Voltar à praça', 'praca')] },

rezar: { cena: 'capela', lugar: 'capela', som: 'sorte', fx: { flag: 'rezou', sorte: 2 }, t:
`Ajoelhas-te na pedra fria e fechas os olhos. Não sabes bem a quem pedes, mas pedes. Quando te levantas, a chama da vela mais próxima endireita-se, como se alguém tivesse fechado uma janela que não existe.

Recuperas 2 pontos de Sorte.`,
 ch: [c('Voltar à nave', 'capela')] },

beata: { cena: 'capela', lugar: 'capela', fx: { flag: 'beata', item: 'Amuleto de Búzio' }, t:
`A mulher chama-se Benedita. O filho dela, Joaquim, ia no segundo barco que se perdeu nos Dentes. Não encontraram o corpo.

— Eu ouço-o — diz ela. — À noite, debaixo do chão, a chamar por mim. Não está morto como os outros mortos. Está preso.

Tira do bolso um búzio pequeno, furado, preso num cordão.

— O Joaquim usava isto contra o canto das moiras. Nessa manhã esqueceu-se dele. Leva-o tu. E se o encontrares lá em baixo, diz-lhe que a mãe não está zangada.`,
 ch: [c('Prometer-lhe que vais tentar', 'capela')] },

exvotos: { cena: 'capela', lugar: 'capela', fx: { flag: 'exvotos', flag2: 'nota' }, t:
`Percorres a parede com uma vela na mão. Entre os ex-votos antigos há um papel dobrado, preso com um alfinete, de tinta ainda fresca. Desdobra-lo.

«Se me acontecer alguma coisa, a chave do farol está onde o corvo dorme. Não confiem em luzes verdes. Não aceitem nada dele. A.»`,
 ch: [c('Guardar o papel e voltar à nave', 'capela')] },

cripta: { cena: 'ossario', lugar: 'capela', fx: { flag: 'cripta' }, escuro: 1, t:
`A escada da cripta é tão estreita que desces de lado. Lá em baixo, os padres antigos da ilha dormem em nichos escavados na rocha, com os nomes quase apagados.

Ao fundo, numa pia talhada em forma de concha, ainda há água benta. E ao lado da pia há um caixão mais recente do que os outros, de madeira clara.

A tampa do caixão está desviada. Só um palmo. Por dentro, está molhado.`,
 ch: [c('Encher o cantil de água benta, depressa', 'cripta_agua'), c('Subir já, sem tocar em nada', 'capela')] },

cripta_agua: { cena: 'ossario', lugar: 'capela', fx: { item: 'Água Benta' }, som: 'garras', susto: 1, tempo: 6, esgotou: 'cripta_agarrado', t:
`Enches o cantil. A água está gelada.

Atrás de ti, a madeira range. A tampa do caixão desliza mais um palmo, devagar, empurrada por dentro. Aparecem quatro dedos brancos e inchados na beira.

A escada está a seis passos.`,
 ch: [c('Correr para a escada', 'cripta_foge'), c('Desembainhar a espada e ficar', 'cripta_luta')] },

cripta_foge: { cena: 'capela', lugar: 'capela', fx: { atencao: 1 }, som: 'porta', t:
`Sobes os degraus de dois em dois e fechas a porta de ferro atrás de ti com toda a força. O trinco cai.

Do outro lado, alguém bate. Três pancadas, lentas, educadas. Depois nada.

Tens a água benta. Dizem que queima o que vem do mar.`,
 ch: [c('Voltar à nave da capela', 'capela')] },

cripta_agarrado: { cena: 'ossario', lugar: 'capela', fx: { en: -2 }, som: 'ferida', susto: 1, t:
`Ficaste parado um segundo a mais. Uma mão fria fecha-se no teu tornozelo e puxa. Cais de costas nas lajes. Do caixão sai um PADRE AFOGADO, de batina podre colada ao corpo, com a boca cheia de areia.`,
 luta: { foes: [{ nome: 'Padre Afogado', hab: 8, en: 8 }], win: 'cripta_ganha' } },

cripta_luta: { cena: 'ossario', lugar: 'capela', t:
`Do caixão sai um PADRE AFOGADO, de batina podre colada ao corpo e a boca cheia de areia. Vem para ti de braços abertos, como quem vai dar uma bênção.`,
 luta: { foes: [{ nome: 'Padre Afogado', hab: 8, en: 8 }], win: 'cripta_ganha' } },

cripta_ganha: { cena: 'ossario', lugar: 'capela', fx: { ouro: 3 }, t:
`O padre desfaz-se em água salgada que escorre para o ralo da cripta. No caixão ficam três moedas antigas, que guardas.

Sobes devagar. Pensas no que Tomé disse sobre os mortos desta ilha, e percebes que não é só uma história.`,
 ch: [c('Voltar à nave da capela', 'capela')] },

casa: { cena: 'casa', lugar: 'casa', zona: 'aldeia', t:
`A porta da casa do faroleiro bate ao vento. Lá dentro, cadeiras viradas e gavetas despejadas no chão. Alguém procurou alguma coisa com pressa, e não encontrou, porque voltou várias vezes: há pegadas molhadas por todo o lado, umas por cima das outras.

Em frente à janela, um corvo empalhado vigia a sala de cima de um poleiro. Ao fundo há uma porta para o quarto e outra, mais pequena, para a despensa. Da despensa vem um barulho de unhas a arranhar madeira.`,
 ch: [c('Examinar o corvo empalhado', 'corvo', { notFlag: 'corvo' }), c('Entrar no quarto', 'quarto', { notFlag: 'quarto' }), c('Abrir a despensa', 'despensa', { notFlag: 'despensa' }), c('Sair para o caminho da falésia', 'falesia1', { mare: 1 }), c('Voltar à praça', 'praca')] },

corvo: { cena: 'casa', lugar: 'casa', fx: { flag: 'corvo' }, t:
`O corvo cheira a pó e a cânfora. Os olhos de vidro parecem seguir-te. O poleiro é um tronco grosso, pregado à parede por baixo da janela.`,
 ch: [c('Procurar por baixo do poleiro, como dizia o papel da capela', 'corvo_chave', { flag: 'nota' }), c('Revistar o corvo ao acaso', 'corvo_procura', { notFlag: 'nota' })] },

corvo_procura: { cena: 'casa', lugar: 'casa', t: `Viras o pássaro de todos os lados, apalpas as penas, abanas o poleiro. Encontrar alguma coisa aqui vai depender da tua sorte.`,

corvo_chave: { cena: 'casa', lugar: 'casa', som: 'chave', fx: { item: 'Chave do Farol' }, t:
`Na parte de baixo do poleiro, a madeira tem uma cavidade tapada com cera. Lá dentro está uma chave de ferro, comprida como a tua mão, com um corvo gravado no anel.`,
 ch: [c('Guardar a chave', 'casa')] },

corvo_nada: { cena: 'casa', lugar: 'casa', t: `Uma asa parte-se-te na mão e cai uma chuva de penas e serradura. Não encontras nada. O corvo, agora torto, parece olhar-te com desprezo.`,
 ch: [c('Desistir do corvo', 'casa')] },

quarto: { cena: 'afogado', lugar: 'casa', som: 'gemido', susto: 1, t:
`O quarto está às escuras e cheira a maré baixa. Há alguém sentado na cama, de costas para ti, a pingar água para o soalho.

— Anselmo? — chamas.

O vulto vira a cabeça devagar, demasiado devagar, e depois o resto do corpo. Não é o Anselmo. É um homem inchado e branco, com algas no cabelo e os olhos leitosos como peixe cozido. Um AFOGADO.

Abre a boca e sai-lhe água do mar. Levanta-se e vem para ti de braços estendidos.`,
 luta: { foes: [{ nome: 'Afogado', hab: 8, en: 8 }], win: 'quarto_ganho', fuga: 'casa', fugaApos: 2 },
 ch_extra: [c('Atirar-lhe sal à cara', 'quarto_sal', { tem: 'Saco de Sal' })] },

quarto_sal: { cena: 'afogado', lugar: 'casa', som: 'gemido', fx: { drop: 'Saco de Sal' }, t:
`Atiras-lhe o sal à cara. O afogado guincha como uma chaleira, tapa os olhos com as mãos e desfaz-se em água ali mesmo, aos teus pés. Usaste o sal todo.`,

quarto_ganho: { cena: 'afogado', lugar: 'casa', fx: { flag: 'quarto', flag2: 'marcas', ouro: 4 }, t:
`Do afogado sobra uma poça que escorre pelas frestas do soalho.

Debaixo da cama encontras o diário do Anselmo. Lês as últimas páginas à luz da janela:

«Gravei a marca do corvo nas rochas da Gruta Afogada para nunca me perder. Quem tiver luz que siga o bico do corvo. Onde o corvo tiver uma cruz por cima, é o ossário dele. Lá não se entra.»

«O Zé Barqueiro não voltou da faina de terça. Encontraram o barco vazio a boiar nos Dentes. Que Deus o tenha.»

«Ele quer a luz apagada até à maré grande. Teme o bronze. Teme o sino. E dá moedas a quem quer marcar.»

Entre as folhas há quatro moedas, que guardas.`,
 alt: [{ tem: 'Moeda Salgada', t:
`Do afogado sobra uma poça que escorre pelas frestas do soalho.

Debaixo da cama encontras o diário do Anselmo. Lês as últimas páginas à luz da janela:

«Gravei a marca do corvo nas rochas da Gruta Afogada para nunca me perder. Quem tiver luz que siga o bico do corvo. Onde o corvo tiver uma cruz por cima, é o ossário dele. Lá não se entra.»

«O Zé Barqueiro não voltou da faina de terça. Encontraram o barco vazio a boiar nos Dentes. Que Deus o tenha.»

«Ele quer a luz apagada até à maré grande. Teme o bronze. Teme o sino. E dá moedas a quem quer marcar. Quem tem uma moeda dele, ele encontra sempre.»

Metes a mão no bolso. A moeda salgada está lá, fria, mais pesada do que antes. O barqueiro que te trouxe era o Zé? E se o Zé morreu na terça, quem é que remou o teu barco?` }],
 fx2: { flag: 'sabeMoeda' },
 ch: [c('Voltar à sala', 'casa')] },

despensa: { cena: 'casa', lugar: 'casa', som: 'garras', fx: { flag: 'despensa' }, t:
`Abres a porta da despensa e o barulho pára. Depois recomeça, mais perto. Vêm do escuro dezenas de olhos pequenos e vermelhos, e um cheiro a peixe podre: RATAZANAS DO MAR, do tamanho de gatos, com as caudas peladas e escamosas.

Atrás delas, pendurada num prego, vês uma lanterna de furacão.`,

despensa_ganha: { cena: 'casa', lugar: 'casa', som: 'chave', fx: { item: 'Lanterna de Furacão' }, t:
`As ratazanas que sobram fogem por um buraco no chão. Tiras a lanterna do prego. Tem vidro grosso, uma grade de ferro e o depósito ainda meio cheio. Acende-se à primeira.

Com isto, nenhum escuro te apanha desprevenido.`,
 ch: [c('Voltar à sala', 'casa')] },

cemiterio: { cena: 'cemiterio', lugar: 'cemiterio', zona: 'aldeia', fx: { flag: 'cemiterio' }, susto: 1, som: 'gemido', t:
`O cemitério é um pedaço de encosta onde as cruzes se inclinam todas para o mar, como se o vento as tivesse penteado. A lua está enorme por cima da árvore morta do centro, e a árvore está cheia de corvos. Nenhum grasna.

As campas recentes estão abertas. A terra não foi cavada de fora para dentro: foi empurrada de dentro para fora.

Algo se mexe atrás das cruzes do fundo. Depois outra coisa. Dois vultos levantam-se devagar, molhados, de algas a escorrer pelos ombros.`,
 ch: [c('Espalhar o sal à tua volta', 'cemiterio_sal', { tem: 'Saco de Sal' }), c('Desembainhar a espada', 'cemiterio_luta'), c('Fugir para a praça', 'praca')] },

cemiterio_sal: { cena: 'cemiterio', lugar: 'cemiterio', fx: { drop: 'Saco de Sal' }, t:
`Desenhas um círculo de sal à tua volta. Os afogados param na linha branca, gemem, e não a atravessam. Ficam ali a olhar-te, a pingar, até que um a um se deitam de novo nas covas.`,

cemiterio_luta: { cena: 'cemiterio', lugar: 'cemiterio', fx: { atencao: 1 }, t: `Os afogados vêm para ti sem pressa, como quem anda debaixo de água. Têm as mãos frias e fortes, e as unhas cheias de areia.`,

lapide: { cena: 'cemiterio', lugar: 'cemiterio', fx: { flag: 'nome' }, t:
`Ao fundo do cemitério, quase escondida pelas silvas, há uma lápide mais antiga do que todas as outras, coberta de sal em vez de musgo. Raspas o sal com a lâmina.

AQUI JAZ VIDAL ESCAMADO
BARQUEIRO DESTA ILHA
AFOGADO EM 1789

Por baixo, alguém riscou com uma faca: «não ficou».

Barqueiro. Agora sabes o nome verdadeiro do bruxo das marés.`,

frota_chega: { cena: 'naufragio', som: 'trovao', susto: 1, fx: { flag: 'tarde' }, t:

Lá longe, no escuro, vês as luzinhas dos mastros a balouçar. Vêm direitas à baía. Direitas aos Dentes. E o farol continua apagado.

Já é tarde para os primeiros barcos. Mas não para os outros. Corre.`,

caca_esconde: { cena: 'recolhedor', tempo: 0, t: `Ficas imóvel. As correntes param mesmo ao teu lado. Sentes o cheiro a mar podre. O gancho passa a um palmo da tua cara.`,

caca_passa: { cena: 'recolhedor', fx: { atencao: -1 }, t:

caca_escapa: { cena: 'recolhedor', fxA: { mare: 1 }, t:

`O Recolhedor cai de joelhos. A lanterna verde parte-se nas pedras e dela saem dezenas de luzinhas, que sobem para o céu como faíscas.

/* ======================= II · A NOITE DOS AFOGADOS ======================= */
cerco1: { cap: 'II · A Noite dos Afogados', cena: 'cerco', lugar: 'praca', som: 'sinogrande', susto: 1, tempo: 8, esgotou: 'cerco_apanhado', fx: { flag: 'cerco' }, t:
`O sino da capela começa a tocar sozinho.

Portas batem por toda a aldeia. Alguém grita. E do mar, devagar, saem vultos. Primeiro dois, depois dez, depois mais do que consegues contar: homens e mulheres afogados, a pingar, a caminhar para as casas como se voltassem do trabalho.

Da porta da taberna, Dona Rosário grita por ti:

— Aqui! Depressa, que eu vou trancar!`,
 ch: [c('Correr para a taberna', 'cerco_taberna'), c('Fugir pelo caminho da falésia', 'cerco_fuga')] },

cerco_apanhado: { cena: 'cerco', lugar: 'praca', susto: 1, som: 'gemido', t:
`Hesitaste. Mãos frias agarram-te por trás, pelo cinto, pelo cabelo. São dois, e cheiram a fundo do mar.`,
 luta: { foes: [{ nome: 'Afogados', hab: 8, en: 8 }], win: 'cerco_taberna_tarde' } },

cerco_taberna_tarde: { cena: 'cerco', lugar: 'taberna', t: `Soltas-te e corres. A porta da taberna está a fechar. Atiras-te pela fresta no último instante e Rosário tranca-a atrás de ti.`,
 ch: [c('Continuar', 'cerco_taberna')] },

cerco_taberna: { cena: 'taberna', lugar: 'taberna', tempo: 9, esgotou: 'cerco_aberta', t:
`Lá dentro, os pescadores pregam tábuas nas janelas. Tomé tem um arpão nas mãos. Lá fora, ouvem-se unhas a arranhar as portadas.

Depois, três pancadas na porta. Uma voz de homem, rouca, cheia de água:

— Rosário. Abre. Sou eu, o Bento. Tenho frio.

Rosário fica branca. Larga o copo, que se parte no chão, e corre para a tranca.`,
 ch: [c('Agarrar Rosário antes que abra', 'cerco_segura'), c('Gritar-lhe que aquele já não é o Bento', 'cerco_grito')] },

cerco_grito: { cena: 'taberna', lugar: 'taberna', t: `— Não é ele! — gritas. Rosário pára com a mão na tranca. Treme. Lá fora, a voz chora o nome dela.`,
 teste: { tipo: 'sorte', ok: 'cerco_segura', ko: 'cerco_aberta' } },

cerco_segura: { cena: 'taberna', lugar: 'taberna', t:
`Puxas Rosário para trás. Por uma fresta das tábuas vês a cara que está do outro lado da porta: o Bento, ou o que sobra dele, com os olhos comidos pelos caranguejos. Está a sorrir.

Rosário encosta a testa ao teu ombro e não diz nada.`,
 ch: [c('Continuar', 'cerco_janela')] },

cerco_aberta: { cena: 'cerco', lugar: 'taberna', susto: 1, som: 'rugido', fx: { flag: 'rosarioFerida' }, t:
`A tranca cai. A porta abre-se. O Bento entra com o mar atrás dele e abraça Rosário com tanta força que lhe ouves as costelas.`,
 luta: { foes: [{ nome: 'Bento, o afogado', hab: 9, en: 9 }], win: 'cerco_aberta_ganha' } },

cerco_aberta_ganha: { cena: 'taberna', lugar: 'taberna', t: `O Bento desfaz-se em água aos pés da mulher. Os pescadores voltam a fechar a porta. Rosário está no chão, com uma costela partida, a chorar sem barulho.`,
 ch: [c('Continuar', 'cerco_janela')] },

cerco_janela: { cena: 'taberna', lugar: 'taberna', som: 'vidro', susto: 1, tempo: 6, esgotou: 'cerco_tome_levado', t:
`A janela ao lado da lareira rebenta. Um braço branco entra pelo buraco e agarra Tomé pelo pescoço. Outro braço, e outro. Estão a puxá-lo para fora.`,
 ch: [c('Agarrar Tomé pelas pernas e puxar', 'cerco_tome_salvo'), c('Cortar os braços com a espada', 'cerco_tome_salvo2')] },

cerco_tome_salvo: { cena: 'taberna', lugar: 'taberna', fx: { flag: 'tomeVivo', en: -1 }, t: `Puxas com toda a força. Tomé volta para dentro aos trambolhões, sem chapéu, com marcas roxas de dedos no pescoço. Um pescador prega uma tábua no buraco.`,
 ch: [c('Continuar', 'cerco_resistir')] },

cerco_tome_salvo2: { cena: 'taberna', lugar: 'taberna', fx: { flag: 'tomeVivo' }, som: 'espada', t: `A tua lâmina corta os braços pelo cotovelo. Caem no chão e ainda se mexem, a abrir e a fechar as mãos. Tomé cai para dentro, a tossir. Um pescador prega uma tábua no buraco.`,
 ch: [c('Continuar', 'cerco_resistir')] },

cerco_tome_levado: { cena: 'cerco', lugar: 'taberna', fx: { flag: 'tomeMorto', item: 'Dente de Tubarão' }, som: 'gemido', t:
`Chegas tarde. Tomé desaparece pela janela como se o tivessem puxado para debaixo de água. Ouves-lo gritar lá fora, uma vez. Depois mais nada.

No chão, junto à janela, ficou o colar dele: um dente de tubarão preso num fio de couro. Apanha-lo.`,
 ch: [c('Continuar', 'cerco_resistir')] },

cerco_resistir: { cena: 'cerco', lugar: 'taberna', t:
`Agora empurram a porta todos ao mesmo tempo. As dobradiças gemem. A tranca começa a dobrar.`,
 luta: { foes: [{ nome: 'Afogados à porta', hab: 8, en: 10 }], win: 'cerco_fim' },
 ch_extra: [c('Despejar o sal na soleira', 'cerco_sal', { tem: 'Saco de Sal' }), c('Abrir a porta e varrê-los com o archote', 'cerco_fogo', { archote: 2 })] },

cerco_sal: { cena: 'taberna', lugar: 'taberna', fx: { drop: 'Saco de Sal' }, t: `Despejas o sal todo ao longo da soleira. Do outro lado, os afogados param de empurrar, como se tivessem batido num muro.`,
 ch: [c('Continuar', 'cerco_fim')] },

cerco_fogo: { cena: 'cerco', lugar: 'taberna', fx: { archote: -2 }, t: `Abres a porta e varres a soleira com o archote. Os afogados recuam do fogo aos gritos, a fumegar. O archote encolhe e quase se apaga.`,
 ch: [c('Continuar', 'cerco_fim')] },

cerco_fim: { cena: 'taberna', lugar: 'taberna', fx: { atencao: 2, item: 'Arpão do Bento', flag: 'rosarioViva' }, t:
`De repente, lá fora, tudo pára.

Espreitas pelas tábuas. Os afogados estão todos de cabeça virada para o mesmo lado, para o alto da falésia, como cães a ouvir um assobio. Depois dão meia volta e descem para o mar, devagar, até a água os cobrir.

— Ele chamou-os — diz Rosário. — Já sabe que estás aqui. Já te viu.

Tira da parede o arpão do Bento e põe-to nas mãos.

— Foi com isto que o meu homem matou um tubarão de seis metros. Crava-o naquele bruxo por mim.`,
 ch: [c('Sair para a praça', 'praca')] },

cerco_fuga: { cena: 'falesia', lugar: 'falesia', fx: { flag: 'fugiuCerco', atencao: 1 }, t:
`Viras costas e corres pelo caminho da falésia. Atrás de ti, a porta da taberna fecha-se com estrondo. Depois ouves vidros a partir, gritos, o sino sempre a tocar.

Não olhas para trás. Mas vais ouvir aqueles gritos durante muito tempo.`,
 ch: [c('Continuar a subir', 'falesia1')] },

/* ======================= III · OS CAMINHOS DO FAROL ======================= */
falesia1: { cap: 'III · Os Caminhos do Farol', cena: 'falesia', lugar: 'falesia', zona: 'falesia', t:
`O caminho da falésia é estreito e sobe aos ziguezagues entre urzes e pedras soltas. O vento empurra-te para o precipício como uma mão aberta. Lá em baixo, o mar ferve contra as rochas.

A meio da subida, o caminho divide-se. Um carreiro de cabras desce para uma pequena praia, onde a boca negra de uma gruta engole e cospe as ondas. Outro, mais curto, corta direito pela charneca, onde o nevoeiro já se deitou.`,
 ch: [c('Continuar pelo caminho até ao farol', 'falesia2', { mare: 1 }), c('Atalhar pela charneca, através do nevoeiro', 'charneca'), c('Descer pelo carreiro até à praia', 'praia', { mare: 1 }), c('Voltar à aldeia', 'praca', { mare: 1 })] },

charneca: { cena: 'avejao', lugar: 'charneca', zona: 'falesia', tempo: 10, esgotou: 'charneca_perdido', t:
`O nevoeiro fecha-se atrás de ti. Ao fim de poucos passos já não vês o mar nem a aldeia.

Depois, muito perto, alguém diz o teu nome.

É uma voz que conheces. Uma voz de alguém de quem gostas e que não vês há muito tempo. Volta a chamar, mais baixo, quase a chorar. Está mesmo atrás de ti.`,
 ch: [c('Responder à voz', 'avejao_resp'), c('Lembrar o aviso do barqueiro e seguir calado', 'charneca_aviso'), c('Voltar para trás a correr', 'falesia1')] },

charneca_aviso: { cena: 'avejao', lugar: 'charneca', t: `Mordes a língua e continuas a andar, de olhos no chão. A voz chama mais três vezes, cada vez mais zangada. Depois começa a rir.`,
 teste: { tipo: 'sorte', ok: 'charneca_sai', ko: 'charneca_perdido' } },

charneca_sai: { cena: 'avejao', lugar: 'charneca', t: `O riso fica para trás. Quando o nevoeiro se abre, estás no alto da falésia, mesmo ao pé do farol. O atalho poupou-te tempo.`,
 ch: [c('Ir até à porta do farol', 'portafarol')] },

charneca_perdido: { cena: 'avejao', lugar: 'charneca', fxA: { mare: 2, en: -1 }, t:
`Andas em círculos. Passas três vezes pela mesma pedra. O frio entra-te nos ossos e o tempo foge-te entre os dedos.

E então, à tua frente, o nevoeiro endurece.`,
 ch: [c('Continuar', 'avejao_resp')] },

avejao_resp: { cena: 'avejao', lugar: 'charneca', som: 'rugido', susto: 1, fx: { atencao: 1 }, t:
`O nevoeiro ergue-se até ao dobro da tua altura, ganha ombros e braços compridos que lhe chegam aos joelhos, e duas brasas pálidas no sítio dos olhos. É um AVEJÃO, a coisa que vive no nevoeiro e se alimenta de quem lhe responde.`,
 luta: { foes: [{ nome: 'Avejão', hab: 10, en: 10 }], win: 'avejao_ganho', fuga: 'falesia1', fugaApos: 2 } },

avejao_ganho: { cena: 'avejao', lugar: 'charneca', t: `A tua espada atravessa-o pela última vez e o avejão desfaz-se em fumo frio, que te entra pela boca e te deixa a tremer. O nevoeiro levanta. Estás no alto da falésia, ao pé do farol.`,
 ch: [c('Ir até à porta do farol', 'portafarol')] },

falesia2: { cena: 'ninhos', lugar: 'ninhos', zona: 'falesia', som: 'gaivota', t:
`Perto do topo, o chão fica branco de excrementos e o ar cheira a peixe podre. Ouves um bater de asas pesado, como lençóis molhados ao vento. Das rochas levantam-se três GAIVOTÕES, aves do tamanho de um homem, com bicos curvos como facas de esfolar.

Há ninhos por toda a parte, e tu estás no meio deles.`,
 ch: [c('Desembainhar a espada e abrir caminho', 'gaivotas_luta'), c('Encostar-te à rocha e passar devagar', 'gaivotas_teste')] },

gaivotas_teste: { cena: 'ninhos', lugar: 'ninhos', t: `Encostas as costas à rocha e avanças de lado, sem tirar os olhos das aves. Uma pedra solta debaixo do pé pode estragar tudo.`,
 teste: { tipo: 'hab', ok: 'gaivotas_ok', ko: 'gaivotas_queda' } },

gaivotas_ok: { cena: 'ninhos', lugar: 'ninhos', t: `Os gaivotões seguem-te com os olhos amarelos, mas nenhum se mexe. Passas o último ninho e chegas ao alto da falésia sem uma beliscadura.`,
 ch: [c('Seguir até à porta do farol', 'portafarol')] },

gaivotas_queda: { cena: 'ninhos', lugar: 'ninhos', susto: 1, som: 'gaivota', tempo: 5, esgotou: 'morte_falesia', t:
`A pedra solta-se. Escorregas. Ficas pendurado na beira da falésia pelas pontas dos dedos, com o mar a rugir lá em baixo. Um gaivotão aterra ao teu lado e começa a bicar-te as mãos.`,
 ch: [c('Largar uma mão e agarrar o pé da ave', 'gaivotas_agarra'), c('Puxar-te para cima com toda a força', 'gaivotas_puxa')] },

gaivotas_agarra: { cena: 'ninhos', lugar: 'ninhos', fx: { en: -2 }, t: `Agarras-lhe a pata. A ave grita e bate as asas para fugir, e o impulso puxa-te para cima. Rolas para a rocha, a sangrar das mãos.`,
 ch: [c('Levantar-te e lutar', 'gaivotas_luta')] },

gaivotas_puxa: { cena: 'ninhos', lugar: 'ninhos', t: `Cravas as unhas na rocha e puxas.`,
 teste: { tipo: 'hab', ok: 'gaivotas_luta', ko: 'morte_falesia' } },

morte_falesia: { cena: 'falesia', lugar: 'ninhos', morte: 1, titulo: 'O mar levou-te', som: 'splash', t:
`Os dedos escorregam. Cais de costas, a ver os gaivotões a ficar pequenos lá em cima, contra as nuvens. O mar recebe-te sem barulho nenhum.

Amanhã, a Câmara de Porto Alto vai mandar outra pessoa.` },

gaivotas_luta: { cena: 'ninhos', lugar: 'ninhos', som: 'gaivota', t: `Os gaivotões caem sobre ti aos gritos, um de cada vez, a picar e a bater as asas.`,
 luta: { foes: [{ nome: 'Primeiro Gaivotão', hab: 7, en: 5 }, { nome: 'Segundo Gaivotão', hab: 7, en: 5 }, { nome: 'Terceiro Gaivotão', hab: 8, en: 6 }], win: 'portafarol' } },

portafarol: { cena: 'farol', lugar: 'farol', zona: 'falesia', t:
`O Farol do Corvo ergue-se à tua frente, branco e altíssimo, contra as nuvens que correm. Lá em cima, por trás dos vidros, vês uma luz esverdeada, fraca, a mexer-se devagar, como se alguém andasse lá dentro a passear com ela.

A porta é de carvalho reforçado a ferro, e está fechada.`,
 ch: [c('Abrir a porta com a chave do corvo', 'base', { req: 'Chave do Farol' }), c('Atirar-te à porta com o ombro', 'porta_ombro'), c('Subir pela parede de fora com a corda', 'escalar', { req: 'Corda de Cânhamo' }), c('Descer até à praia da gruta', 'praia', { mare: 1 })] },

porta_ombro: { cena: 'farol', lugar: 'farol', som: 'porta', fxA: { en: -2, atencao: 1 }, t: `Atiras-te contra a porta com toda a força. É como dar com o ombro numa falésia. Lá em cima, a luz verde pára de se mexer, como quem escuta. Perdes 2 pontos de Energia.`,
 ch: [c('Pensar noutra solução', 'portafarol')] },

escalar: { cena: 'farol', lugar: 'farol', t: `Lanças o gancho da corda. Ao terceiro lance, prende-se no varandim de ferro lá em cima. Começas a subir pela parede molhada, com o vento a tentar arrancar-te dali.`,
 teste: { tipo: 'hab', ok: 'galeria', ko: 'escalar_cai' } },

escalar_cai: { cena: 'farol', lugar: 'farol', som: 'queda', fx: { en: -4, drop: 'Corda de Cânhamo' }, t: `A meio da parede, a corda roça numa aresta e rebenta. Escorregas vários metros e bates no chão de lado. Perdes 4 pontos de Energia, e a corda ficou inútil.`,
 ch: [c('Levantar-te a custo', 'portafarol')] },

/* ===== gruta ===== */
praia: { cena: 'praia', lugar: 'praia', zona: 'falesia', t:
`A praia é uma língua de areia escura que a maré já começou a comer. A entrada da Gruta Afogada é alta como uma igreja, e lá dentro a escuridão é total. De muito longe, do fundo, vem um som abafado: o mar a bater em metal, como um sino tocado debaixo de água.

Não se vê um palmo à frente da cara. Sem luz, lá dentro estás cego.`,
 alt: [{ mareMin: 9, t:
`A maré já cobriu a praia. Das rochas onde estás, a entrada da Gruta Afogada é só uma boca meio submersa, onde o mar entra a rugir e sai a espumar. Para lá chegar, só a nado.

Se esperasses mais um pouco, nem isso.` }],
 ch: [c('Acender a lanterna de furacão e entrar', 'gruta1', { tem: 'Lanterna de Furacão', mareMax: 8 }), c('Entrar com o archote aceso', 'gruta1', { luzArchote: 1, semItem: 'Lanterna de Furacão', mareMax: 8 }), c('Entrar às escuras, às apalpadelas', 'perdido1', { semLuz: 1, mareMax: 8 }),
  c('Nadar até à boca da gruta', 'nadar', { mareMin: 9 }), c('Atirar a moeda salgada ao mar', 'deitar_moeda_praia', { tem: 'Moeda Salgada', flag: 'sabeMoeda' }), c('Subir de volta pelo carreiro', 'falesia1', { mare: 1 })] },

deitar_moeda_praia: { cena: 'praia', lugar: 'praia', fx: { drop: 'Moeda Salgada', atencao: 1 }, som: 'splash', t: `Atiras a moeda às ondas. O mar ferve num círculo branco e acalma. Lá no alto, a luz verde do farol pisca, como um olho que perdeu de vista o que estava a ver.`,
 ch: [c('Voltar à beira da gruta', 'praia')] },

nadar: { cena: 'praia', lugar: 'praia', susto: 1, t: `Atiras-te à água. O frio tira-te o ar. A corrente puxa-te para as rochas e depois para longe delas, como um brinquedo.`,
 teste: { tipo: 'hab', ok: 'nadar_ok', ko: 'nadar_ko' } },

nadar_ok: { cena: 'gruta', lugar: 'gruta', fx: { en: -2, archote: -99 }, t: `Entras na gruta empurrado por uma onda e bates contra uma rocha. Perdes 2 pontos de Energia. Se trazias um archote, a água apagou-o.`,
 ch: [c('Continuar', 'gruta1')] },

nadar_ko: { cena: 'praia', lugar: 'praia', fx: { en: -5 }, som: 'splash', t: `A onda atira-te contra os rochedos e depois devolve-te à praia, a vomitar água salgada. Perdes 5 pontos de Energia.`,
 ch: [c('Tentar outra vez', 'nadar'), c('Desistir e subir o carreiro', 'falesia1', { mare: 1 })] },

gruta1: { cena: 'gruta', lugar: 'gruta', zona: 'gruta', escuro: 1, t:
`A tua luz desenha a gruta à tua volta. A água chega-te aos joelhos e está gelada. As paredes brilham de limos e de caranguejos pequenos que fogem da claridade.

À esquerda, de um túnel, vem um canto doce de mulher. À direita, de outro túnel, vem o som do bronze. Em frente, a água fica negra e funda, num poço. E ao fundo, presa a uma estaca, há uma coisa a boiar.

Na rocha, mesmo ao lado da tua mão, alguém gravou um corvo pequeno, com o bico a apontar para o fundo da gruta.`,
 alt: [{ mareMin: 10, t:
`A tua luz desenha a gruta à tua volta. A água chega-te ao peito e continua a subir. O túnel da esquerda já está quase cheio, e o poço desapareceu debaixo da água.

À direita ainda se ouve o bronze. Ao fundo, presa a uma estaca, há uma coisa a boiar.

Na rocha, mesmo ao lado da tua mão, alguém gravou um corvo pequeno, com o bico a apontar para o fundo da gruta. Despacha-te.` }],
 ch: [c('Seguir o canto pelo túnel da esquerda', 'moira', { notFlag: 'moira', mareMax: 9, mare: 1 }), c('Seguir o som do bronze pelo túnel da direita', 'sino_sala', { semItem: 'Badalo de Bronze', mare: 1 }), c('Mergulhar no poço', 'poco', { notFlag: 'poco', mareMax: 9, mare: 1 }),
  c('Aproximar-te da coisa que boia', 'corpo', { notFlag: 'corpo' }), c('Seguir as marcas do corvo', 'marcas'), c('Sair para a praia', 'praia', { mareMax: 9 })] },

corpo: { cena: 'corpo', lugar: 'gruta', escuro: 1, fx: { flag: 'corpo', flag2: 'sabeMoeda' }, susto: 1, som: 'gemido', t:
`É um homem, atado à estaca pela cintura, de cara para baixo na água. Viras-o com a ponta da espada.

Conheces aquela cara. Inchada, verde, comida pelos peixes, mas conheces. É o barqueiro que te trouxe à ilha esta tarde.

Só que este homem está morto há dias. Tem caranguejos nos bolsos e algas a crescer-lhe no cabelo.

Então quem é que remou o teu barco?`,
 alt: [{ tem: 'Moeda Salgada', t:
`É um homem, atado à estaca pela cintura, de cara para baixo na água. Viras-o com a ponta da espada.

Conheces aquela cara. Inchada, verde, comida pelos peixes, mas conheces. É o barqueiro que te trouxe à ilha esta tarde.

Só que este homem está morto há dias. Tem caranguejos nos bolsos e algas a crescer-lhe no cabelo.

Então quem é que remou o teu barco? E quem é que te deu a moeda que trazes no bolso, e que agora, de repente, está a ficar quente?` }],
 ch: [c('Atirar a moeda salgada à água, já', 'deitar_moeda_gruta', { tem: 'Moeda Salgada' }), c('Revistar-lhe os bolsos', 'corpo_revista'), c('Afastar-te dali', 'gruta1')] },

deitar_moeda_gruta: { cena: 'corpo', lugar: 'gruta', fx: { drop: 'Moeda Salgada', atencao: 1 }, som: 'splash', t: `Atiras a moeda para longe. Onde cai, a água ferve e borbulha durante muito tempo. Lá em cima, através de metros de rocha, ouves um grito abafado de raiva.`,
 ch: [c('Voltar ao meio da gruta', 'gruta1')] },

corpo_revista: { cena: 'corpo', lugar: 'gruta', tempo: 6, esgotou: 'corpo_puxado', fx: { ouro: 3 }, t:
`No bolso do casaco encontras três moedas normais e uma tabela de marés molhada, com a data de hoje marcada a carvão: «maré grande · luz verde · um vivo».

A mão do morto fecha-se no teu pulso.`,
 ch: [c('Puxar o braço com toda a força', 'corpo_solta'), c('Cortar-lhe a mão', 'corpo_corta')] },

corpo_solta: { cena: 'corpo', lugar: 'gruta', fx: { en: -1, flag: 'tabela' }, t: `Arrancas o braço. Os dedos do morto deixam-te marcas roxas no pulso. Ele não se mexe mais. Talvez nunca se tenha mexido.`,
 ch: [c('Afastar-te dali', 'gruta1')] },

corpo_corta: { cena: 'corpo', lugar: 'gruta', fx: { flag: 'tabela' }, som: 'espada', t: `Cortas-lhe a mão pelo pulso. Ela continua agarrada a ti, e tens de lhe abrir os dedos um a um. Atiras-a à água.`,
 ch: [c('Afastar-te dali', 'gruta1')] },

corpo_puxado: { cena: 'corpo', lugar: 'gruta', fx: { en: -4, flag: 'tabela' }, fxA: { mare: 1 }, som: 'splash', susto: 1, t:
`O morto puxa-te para debaixo de água com uma força que nenhum vivo tem. Engoles mar. Debates-te no escuro até conseguires abrir-lhe os dedos e subir, a tossir, sem fôlego. Perdes 4 pontos de Energia.`,
 ch: [c('Afastar-te dali', 'gruta1')] },

marcas: { cena: 'gruta', lugar: 'gruta', escuro: 1, t:
`Segues os corvos gravados de rocha em rocha. São pequenos e fáceis de perder. Ao fim de um corredor estreito há dois: um aponta para uns degraus cortados na pedra, que sobem. O outro tem uma cruz riscada por cima e aponta para uma passagem baixa, de onde vem um cheiro doce e enjoativo, como flores a apodrecer.`,
 ch: [c('Subir os degraus para onde aponta o corvo', 'degraus', { flag: 'marcas', mare: 1 }), c('Entrar na passagem marcada com a cruz', 'ossario', { flag: 'marcas', mare: 1 }), c('Escolher um dos caminhos ao acaso', 'marcas_teste', { notFlag: 'marcas' })] },

marcas_teste: { cena: 'gruta', lugar: 'gruta', t: `Não sabes o que as marcas querem dizer. Uma tem uma cruz, a outra não. Escolhes uma e esperas não te arrepender.`,
 teste: { tipo: 'sorte', ok: 'degraus', ko: 'ossario' } },

perdido1: { cena: 'galerias', lugar: 'galerias', zona: 'gruta', fxA: { mare: 1 }, t:
`Avanças às apalpadelas, com uma mão na rocha e a outra à frente da cara. A entrada da gruta desaparece atrás de ti ao fim de vinte passos. A água sobe-te até à cintura, depois desce.

Já não sabes para que lado fica o mar. Algures à tua esquerda, uma coisa grande desliza na água sem fazer ondas.`,
 ch: [c('Seguir a parede da esquerda', 'perdido2'), c('Seguir o barulho de água a correr', 'perdido3')] },

perdido2: { cena: 'galerias', lugar: 'galerias', som: 'rugido', fxA: { mare: 1 }, susto: 1, t:
`A parede faz uma curva e acaba num lago. Ouves a água abrir-se. Uma coisa lisa e gelada enrola-se-te nas pernas, depois outra. ENGUIAS CEGAS, grossas como braços, de bocas cheias de dentes virados para dentro.

Não as vês. Tens de lutar pelo tacto.`,
 luta: { foes: [{ nome: 'Enguias Cegas', hab: 8, en: 10 }], win: 'perdido4', cego: 1 } },

perdido3: { cena: 'galerias', lugar: 'galerias', fxA: { mare: 1, en: -2 }, t:
`Segues o barulho da água. O chão desaparece-te debaixo dos pés e cais num canal fundo. A corrente leva-te, bate-te contra as rochas, enfia-te por um túnel onde mal cabes, e deita-te noutro sítio igualmente escuro. Perdes 2 pontos de Energia.`,
 ch: [c('Gatinhar para onde o ar parece mais fresco', 'perdido4')] },

perdido4: { cena: 'galerias', lugar: 'galerias', fxA: { mare: 1 }, t:
`Ao fim de não sabes quanto tempo, vês uma claridade cinzenta. Arrastas-te para ela de joelhos.

Sais na mesma praia por onde entraste. A maré subiu muito. Perdeste tempo e forças a andar às voltas no escuro, e não encontraste nada.

Lá dentro, sem luz, não há caminho.`,
 ch: [c('Recuperar o fôlego na praia', 'praia')] },

apagou: { cena: 'galerias', lugar: 'galerias', susto: 1, t:
`A chama do archote encolhe, fica azul, estala e apaga-se. O escuro cai-te em cima como água.

Ficas parado, à escuta. Ouves a tua respiração, o mar ao longe, e uma coisa a mexer-se na água, perto. Muito perto.`,
 ch: [c('Tentar encontrar o caminho às apalpadelas', 'perdido1')] },

moira: { cena: 'moira', lugar: 'moira', fx: { flag: 'moira' }, t:
`O túnel abre-se numa câmara onde a água é limpa e verde-clara, iluminada de baixo como se houvesse sol no fundo do mar. Sentada numa pedra, uma mulher penteia cabelos que lhe descem até à água. Tem a pele cor de pérola e, em vez de pernas, uma cauda de escamas: é uma MOIRA DAS ÁGUAS.

Canta, e o canto puxa-te para ela como uma corda ao pescoço. Dás um passo para a água sem querer. Depois outro.`,
 ch: [c('Agarrar o búzio que trazes ao peito', 'moira_amuleto', { req: 'Amuleto de Búzio' }), c('Cravar as unhas nas mãos e resistir ao canto', 'moira_teste', { semItem: 'Amuleto de Búzio' })] },

moira_teste: { cena: 'moira', lugar: 'moira', t: `Cravas as unhas nas palmas e tentas pensar em qualquer outra coisa: no frio, no farol, no barqueiro. O canto continua, cada vez mais doce.`,
 teste: { tipo: 'sorte', ok: 'moira_resiste', ko: 'moira_cai' } },

moira_cai: { cena: 'moira', lugar: 'moira', som: 'splash', susto: 1, tempo: 5, esgotou: 'morte_moira', t:
`Quando dás por ti, estás com água pelo pescoço e a moira tem os braços à volta do teu pescoço. Está a puxar-te para o fundo. Ainda está a cantar.`,
 ch: [c('Morder-lhe o braço', 'moira_solta'), c('Bater-lhe com o punho da espada', 'moira_solta')] },

moira_solta: { cena: 'moira', lugar: 'moira', fx: { en: -4 }, fxA: { mare: 1 }, t: `Ela solta-te com um guincho. Arrancas-te dali aos tropeções, a tossir água salgada. Ela ri-se e mergulha. Perdes 4 pontos de Energia.`,
 ch: [c('Voltar à entrada da gruta', 'gruta1')] },

morte_moira: { cena: 'moira', lugar: 'moira', morte: 1, titulo: 'O canto da moira', t:
`O canto é tão bonito que deixas de ter vontade de lutar. A água fecha-se por cima da tua cabeça e é morna, e a moira canta-te ao ouvido até ao fim.

Dizem que, nas noites de maré grande, ainda se ouvem duas vozes a cantar na Gruta Afogada.` },

moira_resiste: { cena: 'moira', lugar: 'moira', t: `O canto escorrega-te pelos ouvidos sem te prender. A moira cala-se e olha-te com curiosidade, inclinando a cabeça como uma gaivota.`,
 ch: [c('Ouvir o que ela tem para dizer', 'moira_fala')] },

moira_amuleto: { cena: 'moira', lugar: 'moira', som: 'sorte', t:
`O búzio começa a zumbir contra o teu peito, como uma concha encostada ao ouvido, e o canto da moira desfaz-se nesse som de mar. Ela pára, surpreendida, e olha para o amuleto.

— É do Joaquim — diz. — Ele cantava melhor do que eu. Então podemos conversar.`,
 ch: [c('Ouvir o que ela tem para dizer', 'moira_fala')] },

moira_fala: { cena: 'moira', lugar: 'moira', fx: { flag: 'dica_moira' }, t:
`— O Vidal envenenou-me as águas — diz ela. — Era barqueiro desta ilha, há muito tempo. Afogou-se e não quis ficar afogado. Agora rema quem lhe apetece para onde lhe apetece.

Penteia o cabelo devagar.

— Esta noite precisa de um vivo. Um vivo que suba ao farol pelo seu pé, na maré grande. Com a alma desse vivo, a luz verde acende-se e ele não volta a morrer. Pensa nisso quando lá chegares.

Estende a mão.

— Ajudo-te. Mas no mar nada se dá de graça. Dá-me alguma coisa que brilhe.`,
 ch: [c('Dar-lhe 5 moedas', 'moira_perola', { ouro: 5 }), c('Dar-lhe o Dente de Tubarão', 'moira_perola2', { req: 'Dente de Tubarão' }), c('Recusar e voltar à entrada da gruta', 'gruta1')] },

moira_perola: { cena: 'moira', lugar: 'moira', som: 'sorte', fx: { ouro: -5, item: 'Pérola Negra' }, t: `A moira morde uma moeda, sorri e esconde as outras no cabelo. Depois entrega-te uma pérola negra do tamanho de um ovo de pomba.\n\n— Quando estiveres às portas da morte, parte-a entre os dentes.`,
 ch: [c('Guardar a pérola e voltar à entrada', 'gruta1')] },

moira_perola2: { cena: 'moira', lugar: 'moira', som: 'sorte', fx: { drop: 'Dente de Tubarão', item: 'Pérola Negra' }, t: `A moira examina o dente contra a luz e passa-o pelo cabelo como um pente. Fica satisfeita e entrega-te uma pérola negra do tamanho de um ovo de pomba.\n\n— Quando estiveres às portas da morte, parte-a entre os dentes.`,
 ch: [c('Guardar a pérola e voltar à entrada', 'gruta1')] },

sino_sala: { cena: 'sino', lugar: 'sino', escuro: 1, som: 'garras', susto: 1, t:
`O túnel desce até uma câmara redonda. No centro, meio enterrado na areia e coberto de cracas, está um sino de bronze maior do que tu: o Sino de Santa Bárbara. O badalo ainda lá está dentro.

Mas a areia à volta mexe-se. Primeiro surgem duas antenas compridas como chicotes. Depois duas pinças do tamanho de portas. O CARANGUEJO-REI sai da areia e põe-se entre ti e o sino.`,
 luta: { foes: [{ nome: 'Caranguejo-Rei', hab: 10, en: 12 }], win: 'sino_ganho', fuga: 'gruta1', fugaApos: 2 } },

sino_ganho: { cena: 'sino', lugar: 'sino', som: 'sinogrande', fx: { item: 'Badalo de Bronze', atencao: 2 }, t:
`O caranguejo tomba de lado e as patas param. Rastejas para debaixo do sino e soltas o badalo de bronze, pesado como uma maça de guerra.

Ao arrancá-lo, o badalo bate na boca do sino, uma única vez. O som enche a gruta inteira e sobe pela rocha.

Lá em cima, muito longe, alguém grita. E logo a seguir, ouves correntes.`,
 ch: [c('Voltar à entrada da gruta', 'gruta1')] },

poco: { cena: 'gruta', lugar: 'poco', escuro: 1, fx: { flag: 'poco' }, t: `Pousas a luz numa pedra, respiras fundo e mergulhas no poço negro. A água aperta-te as têmporas. Lá em baixo, a claridade mal chega.`,
 teste: { tipo: 'hab', ok: 'poco_ok', ko: 'poco_ko' } },

poco_ok: { cena: 'gruta', lugar: 'poco', som: 'chave', fx: { ouro: 8, item: 'Óleo de Baleia' }, t: `No fundo, entre ossos e madeira podre, encontras um baú de marinheiro. Lá dentro, oito moedas de ouro e uma bilha de óleo de baleia, ainda selada.\n\nSobes à superfície a rir.`,
 ch: [c('Voltar à entrada da gruta', 'gruta1')] },

poco_ko: { cena: 'gruta', lugar: 'poco', som: 'splash', susto: 1, tempo: 5, esgotou: 'morte_poco', t: `Uma corrente fria agarra-te as pernas e puxa-te para baixo. Bates com a cabeça numa rocha. Não sabes onde é cima.`,
 ch: [c('Nadar na direção das bolhas', 'poco_sobe'), c('Nadar na direção da luz', 'poco_sobe')] },

poco_sobe: { cena: 'gruta', lugar: 'poco', fx: { en: -3 }, t: `Rompes a superfície a arfar, com sangue a escorrer-te pela testa. Perdes 3 pontos de Energia.`,
 ch: [c('Sair do poço', 'gruta1')] },

morte_poco: { cena: 'galerias', lugar: 'poco', morte: 1, titulo: 'O fundo do poço', t: `Esperaste demasiado. O ar acaba. A última coisa que vês é a tua luz, lá em cima, cada vez mais pequena, como uma estrela a apagar-se.` },

ossario: { cena: 'ossario', lugar: 'ossario', escuro: 1, som: 'ameaca', susto: 1, t:
`A passagem dá para uma sala comprida, escavada na rocha. As paredes estão cheias de nichos, e os nichos estão cheios de frascos de vidro verde, centenas deles. Dentro de cada frasco brilha uma luzinha pálida que bate contra o vidro como uma traça.

São almas. Algumas chamam por nomes.

Ao fundo da sala, o que tomaste por um monte de coral mexe-se. Levanta-se. É uma figura enorme, curvada, de braços que lhe chegam ao chão, com a cabeça coberta de ramos de coral. O GUARDIÃO DE CORAL abre dois olhos que brilham como os frascos.`,
 luta: { foes: [{ nome: 'Guardião de Coral', hab: 10, en: 12 }], win: 'ossario_ganho', fuga: 'gruta1', fugaApos: 2 } },

ossario_ganho: { cena: 'ossario', lugar: 'ossario', som: 'sinogrande', fx: { flag: 'almas', sorteMax: 1, atencao: 2 }, t:
`O guardião desfaz-se num monte de coral partido. Começas a partir os frascos, um a um. Cada luzinha que sai sobe ao teto, dá uma volta à tua cabeça e desaparece pela rocha.

Do último frasco sai uma luz que não se vai embora. Ganha a forma de um rapaz.

— Sou o Joaquim. Diz à minha mãe que eu estou bem. E ouve: ele não tem medo da espada. Tem medo de ser lembrado. Quando estiveres diante dele, chama-nos.

A Sorte volta toda ao teu corpo. Mas o barulho dos vidros correu pela rocha acima. Alguém, lá em cima, sabe o que fizeste.`,
 ch: [c('Seguir pela passagem do outro lado', 'degraus', { mare: 1 })] },

degraus: { cena: 'gruta', lugar: 'gruta', zona: 'gruta', escuro: 1, som: 'porta', t:
`Os degraus sobem em caracol por dentro da rocha, escorregadios de limo. Contas cento e doze até chegares a um alçapão de madeira por cima da tua cabeça.

Empurras com o ombro. Cede.`,
 ch: [c('Entrar no farol', 'base')] },

/* ======================= IV · A TORRE ======================= */
base: { cap: 'IV · A Torre', cena: 'torre', lugar: 'torre', zona: 'torre', t:
`Estás na base do farol. Uma escada de ferro em caracol sobe pelo centro da torre e perde-se no escuro, duzentos degraus acima. Ao lado, uma porta pequena dá para a arrecadação, e no chão está o alçapão para a gruta.

Lá de cima vem um cheiro a algas podres e, de vez em quando, um gemido humano. A escada vibra, como se alguém estivesse a andar nela.`,
 ch: [c('Subir a escada de ferro', 'escada', { mare: 1 }), c('Entrar na arrecadação', 'arrecad', { notFlag: 'arrecad' }), c('Descer pelo alçapão até à gruta', 'gruta1', { luz: 1 }), c('Sair pela porta principal', 'portafarol')] },

arrecad: { cena: 'torre', lugar: 'torre', fx: { flag: 'arrecad', prov: 1 }, t:
`Entre redes, latas de tinta e um barril de óleo rachado e vazio, encontras um saco com pão duro. Ganhas 1 Provisão.

Num canto há um pipo com um dedo de óleo no fundo. Não chega para uma noite inteira, mas talvez chegue para umas horas, se for preciso.`,
 ch: [c('Voltar à base da torre', 'base')] },

escada: { cena: 'torre', lugar: 'torre', som: 'sopro', susto: 1, t:
`Sobes. Os degraus de ferro tremem a cada passo e o eco repete-os lá em cima, um bocadinho atrasado, como se alguém subisse a imitar-te.

A meio da torre, a escada passa por uma janela estreita. Do vidro desprende-se uma sombra húmida, da forma de um homem, feita de sal e de espuma: uma SOMBRA SALGADA. Onde te toca, a pele arde e racha.`,
 luta: { foes: [{ nome: 'Sombra Salgada', hab: 8, en: 8 }], win: 'escada_fim' } },

escada_fim: { cena: 'torre', lugar: 'torre', t: `A sombra desfaz-se em sal, que cai pela escada abaixo a tilintar como areia em vidro. Ficas um momento parado, a ouvir. Silêncio.`,
 alt: [{ notFlag: 'recolhedorMorto', t: `A sombra desfaz-se em sal, que cai pela escada abaixo a tilintar como areia em vidro. Ficas um momento parado, a ouvir.

Lá em baixo, a porta da torre abre-se com estrondo.` }],
 ch: [c('Continuar', 'torre_caca1', { notFlag: 'recolhedorMorto' }), c('Continuar a subir', 'patamar', { flag: 'recolhedorMorto' })] },

torre_caca1: { cena: 'torre', lugar: 'torre', som: 'correntes', susto: 1, tempo: 7, esgotou: 'torre_apanhado', caca: 1, t:
`Correntes. Arrastam-se nos degraus de ferro, lá em baixo, e começam a subir. Uma luz verde sobe pela parede da torre, a girar com a escada.

É o RECOLHEDOR. E desta vez sabe exatamente onde estás.`,
 ch: [c('Subir a correr', 'torre_caca2'), c('Esconder-te no vão da janela', 'torre_esconde'), c('Despejar a água benta pela escada abaixo', 'torre_agua', { tem: 'Água Benta' })] },

torre_esconde: { cena: 'torre', lugar: 'torre', t: `Encolhes-te no vão da janela, contra o vidro gelado. A luz verde sobe. As correntes passam a um palmo de ti.`,
 teste: { tipo: 'sorte', ok: 'torre_passou', ko: 'torre_apanhado' } },

torre_passou: { cena: 'torre', lugar: 'torre', t: `O Recolhedor passa por ti e continua a subir. Vai à tua frente. Agora está entre ti e o topo da torre.\n\nSobes atrás dele, devagar, degrau a degrau.`,
 ch: [c('Continuar', 'torre_caca3')] },

torre_agua: { cena: 'torre', lugar: 'torre', som: 'sopro', fx: { drop: 'Água Benta' }, t: `Despejas o cantil pela espiral abaixo. Ouve-se um chiado enorme e um grito sem voz. A luz verde recua, cai, apaga-se lá no fundo. Tens alguns minutos de avanço.`,
 ch: [c('Subir', 'patamar')] },

torre_caca2: { cena: 'torre', lugar: 'torre', som: 'queda', susto: 1, t: `Sobes os degraus de dois em dois. A meio da volta, um degrau ferrugento parte-se debaixo do teu pé. Ficas pendurado pelo corrimão, com as pernas a dar a dar no vazio.`,
 teste: { tipo: 'hab', ok: 'torre_caca3', ko: 'torre_degrau' } },

torre_degrau: { cena: 'torre', lugar: 'torre', fx: { en: -3 }, t: `Consegues içar-te, mas bates com o joelho no ferro com toda a força. Perdes 3 pontos de Energia. As correntes estão mais perto.`,
 ch: [c('Continuar a subir', 'torre_caca3')] },

torre_caca3: { cena: 'torre', lugar: 'torre', som: 'correntes', tempo: 6, esgotou: 'torre_apanhado', caca: 1, t:
`Chegas ao último patamar. A porta da sala da lanterna está fechada à chave. Atrás de ti, o gancho raspa nos degraus. A luz verde já te ilumina as costas.`,
 ch: [c('Abrir a porta com a chave do corvo', 'patamar', { tem: 'Chave do Farol' }), c('Arrombar a porta com o ombro', 'torre_arromba'), c('Virar-te e enfrentá-lo', 'torre_apanhado')] },

torre_arromba: { cena: 'torre', lugar: 'torre', som: 'porta', t: `Atiras-te contra a porta uma vez, duas.`,
 teste: { tipo: 'hab', ok: 'patamar', ko: 'torre_apanhado' } },

torre_apanhado: { cena: 'recolhedor', lugar: 'torre', som: 'rugido', susto: 1, fx: { en: -2 }, t: `O gancho apanha-te pelo casaco e atira-te contra a parede. O RECOLHEDOR ocupa a escada inteira. Não há para onde fugir.`,
 luta: { foes: [{ nome: 'Recolhedor', hab: 11, en: 14 }], win: 'torre_recolhedor_morto' } },

torre_recolhedor_morto: { cena: 'torre', lugar: 'torre', som: 'sinogrande', fx: { flag: 'recolhedorMorto', atencaoZero: 1 }, t: `O Recolhedor cai pela escada abaixo, volta após volta, e a lanterna verde parte-se. Dezenas de luzinhas sobem pela torre e saem pelas janelas. Ficas a arfar, encostado à parede.`,
 ch: [c('Subir o resto da escada', 'patamar')] },

patamar: { cena: 'torre', lugar: 'torre', t:
`Os últimos degraus. A porta da sala da lanterna está entreaberta e deixa sair uma luz verde e doentia. Ouves uma voz de homem, calma e agradável, a cantarolar uma cantiga de pescadores. E ouves correntes a arrastar no chão.

Conheces aquela voz. Já a ouviste esta tarde.`,
 ch: [c('Entrar na sala da lanterna', 'topo')] },

galeria: { cena: 'lanterna', lugar: 'lanterna', t:
`Chegas ao varandim de ferro que rodeia a sala da lanterna. Pelos vidros vês Mestre Anselmo acorrentado a um pilar e, de costas para ti, um homem alto com uma capa que brilha como pele de enguia. Está debruçado sobre a lente, a cobri-la de gosma negra.

Com o uivo do vento, não te ouviu chegar.`,
 ch: [c('Bater com o badalo de bronze no varandim', 'vidal_sino', { req: 'Badalo de Bronze' }), c('Partir o vidro e atacá-lo pelas costas', 'vidal_costas')] },

/* ======================= V · O BRUXO DAS MARÉS ======================= */
topo: { cap: 'V · O Bruxo das Marés', cena: 'lanterna', lugar: 'lanterna', som: 'ameaca', susto: 1, t:
`A sala da lanterna é redonda e toda envidraçada. A grande lente do farol está coberta de uma gosma negra, e a luz verde vem de baixo dela. Acorrentado a um pilar, Mestre Anselmo levanta a cabeça e abana-a devagar, a pedir-te que fujas.

Junto à lente está um homem de costas. Tira o chapéu de oleado e vira-se, e tu reconheces a cara. É o barqueiro que te trouxe à ilha.

Só que agora não tem cara de barqueiro. A pele é lisa demais, os olhos não têm pálpebras, e à volta do pescoço abrem-se e fecham-se guelras.

— Obrigado por teres vindo — diz DOM VIDAL. — Fui eu que remei. Precisava de alguém vivo, que subisse ao farol pelo seu pé, na maré grande. E tu vieste, tão obediente.

Aponta para a lente.

— Falta pouco. Quando a maré encher, a luz verde acende-se com a tua alma, e eu fico vivo outra vez.`,
 ch: [c('Bater com o badalo de bronze na grade de ferro', 'vidal_sino', { req: 'Badalo de Bronze' }), c('Chamá-lo pelo nome verdadeiro: Vidal Escamado', 'vidal_nome', { flag: 'nome', notFlag: 'nomeado' }),
  c('Atacá-lo de espada em punho', 'vidal_luta', { semItem: 'Moeda Salgada' }), c('Atacá-lo de espada em punho', 'vidal_moeda', { tem: 'Moeda Salgada' }), c('Ouvir a proposta dele', 'vidal_proposta')] },

vidal_moeda: { cena: 'lanterna', lugar: 'lanterna', som: 'sopro', susto: 1, fx: { en: -4, drop: 'Moeda Salgada' }, t:
`Dás um passo para ele e o teu corpo pára. A moeda no teu bolso está em brasa. Sentes-a a queimar-te a perna através do pano.

— Aceitaste o meu troco — diz Vidal, a sorrir. — Uma coisa minha que anda contigo. Não me podes ferir enquanto a tiveres.

Arrancas a moeda do bolso com a mão a fumegar e atira-la pela janela. Perdes 4 pontos de Energia. Vidal deixa de sorrir.`,
 ch: [c('Atacá-lo agora', 'vidal_luta')] },

vidal_nome: { cena: 'lanterna', lugar: 'lanterna', som: 'sopro', fx: { flag: 'nomeado' }, t:
`— Vidal Escamado — dizes. — Barqueiro desta ilha. Afogado em 1789.

O sorriso dele estala, literalmente: uma racha abre-se-lhe da boca até à orelha, e por baixo vê-se pele de peixe, cinzenta e velha. Recua um passo, depois outro.

— Quem te disse isso? Quem te...

Pela primeira vez, tem medo. Mas um bicho com medo ainda morde.`,
 ch: [c('Bater com o badalo na grade enquanto ele hesita', 'vidal_sino', { req: 'Badalo de Bronze' }), c('Atacar agora que ele está fraco', 'vidal_luta_nome', { semItem: 'Moeda Salgada' }), c('Atacar agora que ele está fraco', 'vidal_moeda', { tem: 'Moeda Salgada' })] },

vidal_proposta: { cena: 'lanterna', lugar: 'lanterna', t:
`— Não precisa de ser a tua alma — diz Vidal, e a voz dele escorre como mel. — Pode ser a do Anselmo. Ele é velho, já viveu. Tu desces a escada, e eu dou-te a prata que vem nos porões da frota que se vai afundar daqui a pouco. Ninguém vai saber.

Enquanto fala, as palavras dele ficam cada vez mais doces, e tu dás contigo a pensar que talvez não seja má ideia.`,
 ch: [c('Deixar o búzio limpar-te a cabeça e recusar', 'vidal_luta', { req: 'Amuleto de Búzio' }), c('Lutar contra a voz dele e recusar', 'vidal_encanto', { semItem: 'Amuleto de Búzio' }), c('Aceitar o negócio', 'fim_mau')] },

vidal_encanto: { cena: 'lanterna', lugar: 'lanterna', t: `Abanas a cabeça como quem sacode água dos ouvidos. As palavras de Vidal agarram-se a ti como limos.`,
 teste: { tipo: 'sorte', ok: 'vidal_luta', ko: 'vidal_encantado' } },

 <ul><li><b>Habilidade</b>: a tua mestria com a espada.</li><li><b>Energia</b>: a tua vida. Se chegar a zero, morres.</li><li><b>Sorte</b>: lanças dois dados e precisas de tirar igual ou menos. Cada teste gasta 1 ponto.</li><li><b>Maré</b>: cada sítio onde vais faz subir a maré. Com a maré, a ilha muda: os mortos saem do mar, a praia fica debaixo de água, a frota aproxima-se. Não dá para ver tudo.</li><li><b>O Recolhedor</b>: cada barulho que fazes chama-o. Quando vier, esconde-te ou foge.</li><li><b>Escolhas com tempo</b>: às vezes tens poucos segundos para decidir. Se hesitares, alguém decide por ti. Podes desligá-las nas opções.</li><li><b>Luz</b>: há lugares onde, sem luz, não vês o caminho. Um archote apaga-se ao fim de pouco tempo.</li><li><b>Dedo no livro</b>: podes voltar atrás algumas vezes, como quem deixa o dedo na página.</li></ul>
 <p>Podes morrer de muitas maneiras. Só há um caminho para o melhor final.</p></details></div>`; }
