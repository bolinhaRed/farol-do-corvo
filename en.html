 "quarto_ganho": {

  "fx": {
   "flag": "quarto",
   "flag2": "marcas",
   "ouro": 4
  },
  "t": "All that is left of the drowned man is a puddle seeping between the floorboards.\n\nUnder the bed you find Anselmo’s diary. You read the last pages by the light of the window:\n\n“I carved the mark of the raven on the rocks of the Drowned Cave so I would never get lost. Whoever has a light should follow the raven’s beak. Where the raven has a cross above it, that is his ossuary. Nobody goes in there.”\n\n“Zé the boatman did not come back from Tuesday’s fishing. They found his boat floating empty on the Teeth. God rest him.”\n\n“He wants the light out until the spring tide. He fears bronze. He fears the bell. And he gives coins to those he wants to mark.”\n\nBetween the pages there are four coins, which you keep.",
  "alt": [
   {
    "tem": "Salted Coin",
    "t": "All that is left of the drowned man is a puddle seeping between the floorboards.\n\nUnder the bed you find Anselmo’s diary. You read the last pages by the light of the window:\n\n“I carved the mark of the raven on the rocks of the Drowned Cave so I would never get lost. Whoever has a light should follow the raven’s beak. Where the raven has a cross above it, that is his ossuary. Nobody goes in there.”\n\n“Zé the boatman did not come back from Tuesday’s fishing. They found his boat floating empty on the Teeth. God rest him.”\n\n“He wants the light out until the spring tide. He fears bronze. He fears the bell. And he gives coins to those he wants to mark. Whoever carries one of his coins, he always finds.”\n\nYou put your hand in your pocket. The salted coin is there, cold, heavier than before. Was the boatman who brought you Zé? And if Zé died on Tuesday, who rowed your boat?"

 "topo": {
  "cap": "V · The Tide Witch",
  "cena": "lanterna",
  "lugar": "lanterna",
  "som": "ameaca",
  "susto": 1,
  "t": "The lantern room is round and walled with glass. The great lens of the lighthouse is coated in black slime, and the green light comes from beneath it. Chained to a pillar, Master Anselmo raises his head and shakes it slowly, begging you to run.\n\nBeside the lens stands a man with his back to you. He takes off his oilskin hat and turns, and you know the face. It is the boatman who brought you to the island.\n\nOnly now it is not a boatman’s face. The skin is too smooth, the eyes have no lids, and around his neck gills open and close.\n\n“Thank you for coming,” says DOM VIDAL. “It was I who rowed. I needed someone living to climb to the lighthouse on their own two feet, at the spring tide. And you came, so obedient.”\n\nHe points at the lens.\n\n“Not long now. When the tide is full, the green light will burn with your soul, and I will be alive again.”",

  "t": "You take a step towards him and your body stops. The coin in your pocket is red hot. You feel it burning your leg through the cloth.\n\n“You accepted my change,” says Vidal, smiling. “Something of mine that travels with you. You cannot harm me while you carry it.”\n\nYou tear the coin out of your pocket, your hand smoking, and hurl it through the window. You lose 4 Stamina points. Vidal stops smiling.",

  "som": "sopro",

  "t": "“Vidal Escamado,” you say. “Boatman of this island. Drowned in 1789.”\n\nHis smile cracks, literally: a split opens from his mouth to his ear, and beneath it you see fish skin, grey and old. He takes a step back, then another.\n\n“Who told you that? Who told you...”\n\nFor the first time, he is afraid. But a frightened animal still bites.",

 ${st.flags.recolhedorMorto ? '' : `<div class="sec"><h4>The Gatherer</h4><div class="linha2"><span>${olhos(st.atencao)}</span></div><p class="nota" style="margin:0">${(st.cacaPend || 0) > 0 ? 'It is looking for you. You hear chains.' : 'Every noise you make calls it. When all the eyes light up, it comes for you.'}</p></div>`}
 <div class="sec"><div class="linha2"><span>Gold: <b style="font-family:var(--f-num);font-size:1.15rem">${st.ouro}</b> coins</span></div>
 <div class="linha2"><span>Provisions: <b style="font-family:var(--f-num);font-size:1.15rem">${st.prov}</b></span><button class="mini" data-a="comer" ${st.prov <= 0 || st.en >= st.enI || emLuta || st.morto ? 'disabled' : ''}>Eat (+4 Sta)</button></div>
 ${P ? `<div class="linha2"><span>${POCOES[P.tipo].nome}<small style="display:block;color:var(--tinta2);font-size:.78rem;font-style:italic">${P.doses} ${P.doses === 1 ? 'dose' : 'doses'} · ${POCOES[P.tipo].d}</small></span><button class="mini" data-a="beber" ${P.doses <= 0 || st.morto ? 'disabled' : ''}>Drink</button></div>` : ''}
 ${st.archote > 0 && !temLanterna() ? `<div class="linha2"><span>Lit torch <span class="chama">${Array.from({ length: 5 }, (_, k) => `<i class="${k < st.archote ? '' : 'gasta'}"></i>`).join('')}</span></span></div>` : ''}</div>
 <div class="sec"><h4>Equipment</h4><ul class="itens"><li>Sword and leather armour</li>${st.itens.map(i => `<li class="linha2"><span>${i}<small>${ITENS[i] || ''}</small></span>${i === 'Black Pearl' ? `<button class="mini" data-a="perola" ${st.morto ? 'disabled' : ''}>Use</button>` : ''}</li>`).join('')}</ul></div>
 ${st.dedosI > 0 ? `<div class="sec"><h4>Finger in the book</h4><div class="linha2"><span class="dedos">${Array.from({ length: st.dedosI }, (_, k) => `<i class="${k < st.dedos ? '' : 'gasto'}"></i>`).join('')}</span><button class="mini" data-a="dedo" ${st.dedos <= 0 || !st.undo.length ? 'disabled' : ''}>Go back</button></div></div>` : ''}
 <div class="sec"><h4>Trail</h4><div class="rasto">${st.rasto.slice(-40).map(n => `<span>${n}</span>`).join('')}</div></div></div>
 <div class="ficha mapa"><div class="tit"><h4>Island map</h4><button class="mini" data-a="mapa">Enlarge</button></div>${mapaSVG(false)}</div>
 <div class="ficha"><div class="opc"><h4 style="margin:0 0 4px;font-family:var(--f-tit);font-weight:400;font-size:1.1rem">Options</h4>
 <label for="o-vol-txt">Volume: ${VOL_TXT[Som.nivel]}<button class="mini" id="o-vol-txt" data-a="vol">Change</button></label>
 <label for="o-mus">Background music<input type="checkbox" id="o-mus" ${Som.musica ? 'checked' : ''}></label>
 <label for="o-tempo">Timed choices<input type="checkbox" id="o-tempo" ${opTempo() ? 'checked' : ''}></label>
 ${Voz.ok ? `<label for="o-voz">Narrator reads the pages<input type="checkbox" id="o-voz" ${Voz.on ? 'checked' : ''}></label>` : ''}
 <p class="nota" style="margin:2px 0 0">Best with headphones. The narrator’s voice depends on your device.</p></div></div>`; }

function mapaSVG(grande) { const vis = st.locs || {}, atual = S[st.sec].lugar, LG = Historia.LUGARES;
 let h = `<svg viewBox="0 0 310 400" role="img" aria-label="Map of Raven Island"><defs><filter id="tm"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="9"/><feDisplacementMap in="SourceGraphic" scale="2.2" xChannelSelector="R" yChannelSelector="G"/></filter></defs>
 <rect x="2" y="2" width="306" height="396" fill="none" stroke="#160f07" stroke-width="1.5"/><rect x="6" y="6" width="298" height="388" fill="none" stroke="#160f07" stroke-width=".6"/><g filter="url(#tm)" fill="none" stroke="#160f07">
 <path d="M60 395 Q45 340 22 300 Q8 262 24 236 Q60 204 90 160 Q110 110 150 80 Q180 42 215 22 Q252 12 270 40 Q306 80 304 140 Q300 200 304 250 Q306 300 292 340 Q272 384 250 395" stroke-width="1.8"/>
 ${[[20, 120], [40, 170], [30, 70], [110, 40], [150, 24], [296, 330], [284, 380], [200, 392], [105, 392]].map(([x, y]) => `<path d="M${x} ${y} q4 -4 8 0 q4 4 8 0" stroke-width=".9"/>`).join('')}
 <circle cx="36" cy="362" r="14" stroke-width=".8"/><path d="M36 343 L40 362 L36 381 L32 362 Z M17 362 L36 358 L55 362 L36 366 Z" fill="#160f07" stroke-width=".6"/></g>
 <text x="36" y="340" text-anchor="middle" font-family="IM Fell English SC, serif" font-size="10" fill="#160f07">N</text>
 <text x="14" y="32" font-family="IM Fell English SC, serif" font-size="17" fill="#160f07">Raven Island</text><text x="14" y="47" font-family="IM Fell English, serif" font-style="italic" font-size="9.5" fill="#4f3c22">the stranger’s map</text>`;
 Historia.CAMINHOS.forEach(([a, b]) => { if (vis[a] && vis[b]) { const A = LG[a], B = LG[b]; h += `<line x1="${A[0]}" y1="${A[1]}" x2="${B[0]}" y2="${B[1]}" stroke="#4f3c22" stroke-width=".8" stroke-dasharray="1.5 4" stroke-linecap="round"/>`; } });
 const cam = (st.caminho || []).slice(-14); for (let i = 1; i < cam.length; i++) { const A = LG[cam[i - 1]], B = LG[cam[i]]; if (!A || !B) continue; const dx = B[0] - A[0], dy = B[1] - A[1], len = Math.hypot(dx, dy) || 1, ang = Math.atan2(dy, dx) * 180 / Math.PI + 90, nx = -dy / len, ny = dx / len, op = (.25 + .75 * i / (cam.length - 1)).toFixed(2);
  for (let s = 10, k = 0; s < len - 8; s += 9, k++) { const sd = k % 2 ? 2.4 : -2.4, x = A[0] + dx * s / len + nx * sd, y = A[1] + dy * s / len + ny * sd; h += `<ellipse cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" rx="1.3" ry="2.3" transform="rotate(${ang.toFixed(0)} ${x.toFixed(1)} ${y.toFixed(1)})" fill="#160f07" opacity="${op}"/>`; } }
 Object.entries(LG).forEach(([k, [x, y, nome, an]]) => { if (!vis[k]) return; const nv = Novo.loc === k && !grande ? ' loc-novo' : ''; let tx = x + 8, ty = y + 3.5, ta = 'start'; if (an === 'e') { tx = x - 8; ta = 'end'; } if (an === 'b') { tx = x; ty = y + 15; ta = 'middle'; } if (an === 'a') { tx = x; ty = y - 8; ta = 'middle'; }
  h += `<g class="${nv}"><circle cx="${x}" cy="${y}" r="3.4" fill="#160f07"/><circle cx="${x}" cy="${y}" r="6" fill="none" stroke="#160f07" stroke-width=".7"/><text x="${tx}" y="${ty}" text-anchor="${ta}" font-family="IM Fell English, serif" font-size="10.5" fill="#160f07">${nome}</text></g>`; });
 if (atual && LG[atual]) { const [x, y] = LG[atual]; h += `<circle class="aqui" cx="${x}" cy="${y}" r="8" fill="#8b2716" opacity=".85"/><circle cx="${x}" cy="${y}" r="3" fill="#e2cb98"/>`; }
 return h + '</svg>'; }
function abrirMapa(v) { const m = $('#mapaGrande'); if (!v) { m.hidden = true; m.innerHTML = ''; return; } m.innerHTML = `<div class="folhamapa"><div class="linha2"><span style="font-family:var(--f-tit);font-size:1.3rem">Island map</span><button class="mini" data-a="fecharmapa">Close</button></div>${mapaSVG(true)}<p class="nota" style="margin:6px 0 0">Places appear in ink as you discover them. The footprints show your most recent path.</p></div>`; m.hidden = false; }

function capa(novo) { const sv = carregarJogo(), f = finais(), n = Object.keys(FINAIS).filter(k => f[k]).length;
 $('#topo').innerHTML = ''; Ilus.mostrar('farol', novo !== false);
 $('#corpo').innerHTML = `<div class="capa fade"><h1>The Raven Lighthouse</h1><p class="sub">A horror gamebook in which you are the hero. One night, one island, one rising tide, and something hunting you.</p>
 <div class="acoes">${sv && !sv.fim && !sv.morto ? `<button class="b prim" data-a="continuar">Continue at section ${NUM[sv.sec]}</button>` : ''}<button class="b ${sv && !sv.fim && !sv.morto ? '' : 'prim'}" data-a="criar">New adventure</button></div>
 <p class="nota" style="margin-top:14px">Endings found: ${n} of ${Object.keys(FINAIS).length}</p><p class="nota"><a href="index.html" style="color:inherit">Jogar em português</a></p>
 <p class="aviso-som">Play with sound. The speaker button at the top changes the volume.</p>
 <details class="regras"><summary>How to play</summary>
 <p>You read a section and choose what to do. Each choice sends you to another numbered section, like the gamebooks of old. The game takes care of the page-turning, the dice and the Adventure Sheet.</p>
 <ul><li><b>Skill</b>: your mastery of the sword.</li><li><b>Stamina</b>: your life. If it reaches zero, you die.</li><li><b>Luck</b>: you roll two dice and need to score equal or less. Each test costs 1 point.</li><li><b>Tide</b>: every place you go makes the tide rise. With the tide, the island changes: the dead come out of the sea, the beach goes under water, the fleet draws closer. You cannot see everything.</li><li><b>The Gatherer</b>: every noise you make calls it. When it comes, hide or run.</li><li><b>Timed choices</b>: sometimes you have only a few seconds to decide. If you hesitate, someone decides for you. You can turn them off in the options.</li><li><b>Light</b>: some places are impossible to find your way through without light. A torch burns out quickly.</li><li><b>Finger in the book</b>: you can go back a few times, like keeping a finger on the page.</li></ul>
 <p>You can die in many ways. There is only one path to the best ending.</p></details></div>`; }
function rolarCr() { const h = rol(1), e = rol(2), s = rol(1); Object.assign(cr, { h, e, s, hab: 6 + h[0], en: 12 + soma(e), sorte: 6 + s[0] }); Som.fx('dados'); }
function criar() { if (!cr.h) rolarCr(); if (!cr.modo) cr.modo = 'normal'; $('#topo').innerHTML = '';
 $('#corpo').innerHTML = `<div class="fade"><h2 class="titulo2" style="font-size:2rem;text-align:center;margin-top:0">Your character</h2><p style="text-align:center">The dice decide who you are. If you don’t like it, roll again.</p>
 <div class="criar rola"><div class="cx"><div class="lab">Skill</div><div class="val">${cr.hab}</div>${dados(cr.h)}<div class="ini">1 die + 6</div></div><div class="cx"><div class="lab">Stamina</div><div class="val">${cr.en}</div>${dados(cr.e)}<div class="ini">2 dice + 12</div></div><div class="cx"><div class="lab">Luck</div><div class="val">${cr.sorte}</div>${dados(cr.s)}<div class="ini">1 die + 6</div></div></div>
 <div class="acoes" style="justify-content:center"><button class="b" data-a="relancar">Roll again</button></div>
 <h3 class="titulo2">Game mode</h3><div class="grelha3">${Object.entries(MODOS).map(([k, m]) => `<button class="opcao ${cr.modo === k ? 'sel' : ''}" data-modo="${k}" aria-pressed="${cr.modo === k}"><b>${m.nome}</b><small>${m.d}</small></button>`).join('')}</div>
 <h3 class="titulo2">Choose a potion (2 doses)</h3><div class="grelha3">${Object.entries(POCOES).map(([k, p]) => `<button class="opcao ${cr.pocao === k ? 'sel' : ''}" data-pocao="${k}" aria-pressed="${cr.pocao === k}"><b>${p.nome}</b><small>${p.d}</small></button>`).join('')}</div>
 <div class="acoes" style="margin-top:20px"><button class="b prim" data-a="comecar" ${cr.pocao ? '' : 'disabled'}>${cr.pocao ? 'Begin the adventure' : 'Choose a potion to begin'}</button><button class="b" data-a="capa">Back</button></div></div>`; }
function comecar() { const M = MODOS[cr.modo]; st = { modo: cr.modo, limite: M.limite, inim: M.inim, habI: cr.hab, hab: cr.hab, enI: cr.en, en: cr.en, sorteI: cr.sorte, sorte: cr.sorte, ouro: M.ouro, prov: M.prov, pocao: { tipo: cr.pocao, doses: 2 }, itens: [], flags: {}, visto: { start: 1 }, mare: 0, rasto: [1], dedos: M.dedos, dedosI: M.dedos, undo: [], sec: 'start', luta: null, res: null, morto: false, fim: null, locs: { cais: 1 }, caminho: ['cais'], archote: 0, atencao: 0, cacaPend: 0, visita: 1, encontros: 0 };
 cr = null; Novo.loc = 'cais'; guardar(); Som.desbloquear(); Som.fx('pagina'); render(true, false, true);
 Ilus.aquecer(['taberna', 'capela', 'casa', 'cemiterio', 'falesia', 'afogado', 'praia', 'gruta', 'galerias', 'ninhos', 'farol', 'avejao', 'moira', 'sino', 'ossario', 'torre', 'lanterna', 'rei', 'aceso', 'naufragio', 'cerco', 'recolhedor', 'corpo']); }

function abrirFolha(v) { $('#folha').classList.toggle('aberta', v); $('#veu').hidden = !v; }
document.addEventListener('click', e => {
 if (e.target.closest('#ilus')) { Ilus.acabar(); return; }
 if (e.target.id === 'mapaGrande') { abrirMapa(false); return; }
 const b = e.target.closest('button'); if (!b || b.disabled) return;
 Som.desbloquear();
 if (b.dataset.ir) { abrirFolha(false); ir(b.dataset.ir, { mare: +(b.dataset.mare || 0) }); return; }
 if (b.dataset.compra != null) { comprar(+b.dataset.compra); return; }
 if (b.dataset.pocao) { cr.pocao = b.dataset.pocao; criar(); return; }
 if (b.dataset.modo) { cr.modo = b.dataset.modo; criar(); return; }
 ({ testar, duelo: duelar, atacar, agua: aguaBenta, sorteluta: sorteLuta, faca, fugir, comer, beber, perola, dedo, comecar,
  folha: () => abrirFolha(true), fechar: () => abrirFolha(false), mapa: () => abrirMapa(true), fecharmapa: () => abrirMapa(false),
  vol: () => { Som.ciclo(); if (st) { barHTML(); folhaHTML(); render(); } else { barHTML(); Som.cena('falesia', 'explorar'); } Som.fx('pagina'); },
  menu: () => { guardar(); Voz.parar(); pararRelogio(); st = null; cr = null; abrirFolha(false); Som.coracao(false); Som.cena('falesia', 'explorar'); render(false); },
  capa: () => { cr = null; render(false); },
  continuar: () => { st = carregarJogo(); st.visita = (st.visita || 0) + 1; Novo.loc = null; render(true, false, true); },
  criar: () => { cr = {}; Som.cena('porto', 'explorar'); render(false); },
  relancar: () => { rolarCr(); criar(); },
  nova: () => { pararRelogio(); st = null; cr = {}; abrirFolha(false); Voz.parar(); Som.coracao(false); render(false); },
 }[b.dataset.a] || (() => { }))();
});
document.addEventListener('change', e => { if (e.target.id === 'o-tempo') { setTempo(e.target.checked); if (st) render(); } if (e.target.id === 'o-mus') Som.setMusica(e.target.checked); if (e.target.id === 'o-voz') { Voz.set(e.target.checked); if (e.target.checked && st) Voz.ler(S[st.sec].t); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { abrirMapa(false); abrirFolha(false); } });
$('#veu').addEventListener('click', () => abrirFolha(false));
render(true);
if ('serviceWorker' in navigator && !/claude|anthropic/.test(location.hostname)) { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { } }
</script>

</body></html>
